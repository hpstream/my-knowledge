		<script type="importmap">

				"imports": {
					"three": "../build/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			
			/* THREE_TOPIC_LEARNING_NOTES_START
			 * 本注释由本地 Three.js 专题生成，保留官网案例代码结构，只补学习说明。
			 * 案例：webgl_materials_physical_transmission_alpha.html
			 * 分组：B｜光照材质
			 * 目标：学习透明/透射材质如何结合 alpha 贴图，让材质局部透明或局部透射。
			 *
			 * 阅读顺序：先找 renderer 的 color/toneMapping/output 设置，再找 light / material / environment，最后看 GUI 参数如何改变光照或材质。光照材质类案例要重点观察“哪个参数改变了亮度、阴影、反射、透明或贴图清晰度”。
			 *
			 * 核心知识点：
			 * 1. alphaMap 控制局部透明度
			 * 2. transmission 控制透射
			 * 3. transparent 必须开启混合
			 * 4. 贴图 alpha 和物理透射是两层概念
			 * 5. 适合镂空玻璃、纹理透明塑料
			 *
			 * 本案例的关键代码片段，可以在下面源码中搜索这些语句：
			 *   const params = {
			 *     transmission: 1,
			 *     opacity: 1,
			 *     roughness: 0,
			 *     thickness: 0.01,
			 *     envMapIntensity: 1,
			 *   };
			 *   
			 *   material.transmission = params.transmission;
			 *   material.transparent = transparent;
			 *
			 * 这些代码在做什么：
			 * 1. alphaMap 决定哪些区域可见、哪些区域透明。
			 * 2. transmission 决定可见区域的光是否能穿过材质。
			 * 3. transparent: true 让材质进入透明渲染流程。
			 * 4. DoubleSide 适合薄片透明材质，否则背面可能不可见。
			 * 5. 透明排序和深度写入可能带来边缘问题，需要按项目调试。
			 *
			 * 学完后可以迁移到：
			 * 1. 镂空玻璃贴花
			 * 2. 透明 UI 板
			 * 3. 塑料包装
			 * 4. 树叶/网格透明材质
			 * 5. 带图案的亚克力
			 *
			 * 对应讲解文档：../官方案例讲解/B-光照材质/webgl_materials_physical_transmission_alpha.md
			 * THREE_TOPIC_LEARNING_NOTES_END */
import * as THREE from 'three';

			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { UltraHDRLoader } from 'three/addons/loaders/UltraHDRLoader.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

			/* THREE_TOPIC_CORE_NOTE_START
			 * 学习注释：alphaMap 决定哪些区域可见、哪些区域透明。
			 * THREE_TOPIC_CORE_NOTE_END */
			const params = {
				color: 0xffffff,
				transmission: 1,
				opacity: 1,
				metalness: 0,
				roughness: 0,
				ior: 1.5,
				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：transmission 决定可见区域的光是否能穿过材质。
				 * THREE_TOPIC_CORE_NOTE_END */
				thickness: 0.01,
				attenuationColor: 0xffffff,
				attenuationDistance: 1,
				specularIntensity: 1,
				specularColor: 0xffffff,
				envMapIntensity: 1,
				lightIntensity: 1,
				exposure: 1
			};

			let camera, scene, renderer;

			let mesh, material;

			const hdrEquirect = new UltraHDRLoader()
				.setPath( 'textures/equirectangular/' )
				.load( 'royal_esplanade_2k.hdr.jpg', function () {

					hdrEquirect.mapping = THREE.EquirectangularReflectionMapping;

					new GLTFLoader()
						.setPath( 'models/gltf/' )
						.load( 'DragonAttenuation.glb', function ( gltf ) {

							gltf.scene.traverse( function ( child ) {

								if ( child.isMesh && child.material.isMeshPhysicalMaterial ) {

									mesh = child;
									material = mesh.material;

									const color = new THREE.Color();

									params.color = color.copy( mesh.material.color ).getHex();
									params.roughness = mesh.material.roughness;
									params.metalness = mesh.material.metalness;

									params.ior = mesh.material.ior;
									params.specularIntensity = mesh.material.specularIntensity;

									params.transmission = mesh.material.transmission;
									params.thickness = mesh.material.thickness;
									params.attenuationColor = color.copy( mesh.material.attenuationColor ).getHex();
									params.attenuationDistance = mesh.material.attenuationDistance;

								}

							} );

							init();

							scene.add( gltf.scene );

							scene.environment = hdrEquirect;
							//scene.background = hdrEquirect;

							render();

						} );

				} );
			/* THREE_TOPIC_INIT_NOTE_START
			 * init() 是案例搭建阶段：通常会创建 renderer、camera、scene、灯光、材质、模型、GUI 和事件。读这个函数时先看对象如何被创建和加入 scene。
			 * THREE_TOPIC_INIT_NOTE_END */


			function init() {

				renderer = new THREE.WebGLRenderer( { antialias: true, alpha: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.shadowMap.enabled = true;
				document.body.appendChild( renderer.domElement );

				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.toneMappingExposure = params.exposure;

				// accommodate CSS table
				renderer.domElement.style.position = 'absolute';
				renderer.domElement.style.top = 0;

				scene = new THREE.Scene();

				camera = new THREE.PerspectiveCamera( 40, window.innerWidth / window.innerHeight, 1, 2000 );
				camera.position.set( - 5, 0.5, 0 );

				const controls = new OrbitControls( camera, renderer.domElement );
				controls.addEventListener( 'change', render ); // use if there is no animation loop
				controls.minDistance = 5;
				controls.maxDistance = 20;
				controls.target.y = 0.5;
				controls.update();

				window.addEventListener( 'resize', onWindowResize );

				//

				const gui = new GUI();

				gui.addColor( params, 'color' )
					.onChange( function () {

						material.color.set( params.color );
						render();

					} );

				gui.add( params, 'transmission', 0, 1, 0.01 )
					.onChange( function () {

						/* THREE_TOPIC_CORE_NOTE_START
						 * 学习注释：transparent: true 让材质进入透明渲染流程。
						 * THREE_TOPIC_CORE_NOTE_END */
						material.transmission = params.transmission;
						render();

					} );

				gui.add( params, 'opacity', 0, 1, 0.01 )
					.onChange( function () {

						material.opacity = params.opacity;
						const transparent = params.opacity < 1;

						if ( transparent !== material.transparent ) {

							/* THREE_TOPIC_CORE_NOTE_START
							 * 学习注释：DoubleSide 适合薄片透明材质，否则背面可能不可见。
							 * THREE_TOPIC_CORE_NOTE_END */
							material.transparent = transparent;
							material.needsUpdate = true;

						}

						render();

					} );

				gui.add( params, 'metalness', 0, 1, 0.01 )
					.onChange( function () {

						material.metalness = params.metalness;
						render();

					} );

				gui.add( params, 'roughness', 0, 1, 0.01 )
					.onChange( function () {

						material.roughness = params.roughness;
						render();

					} );

				gui.add( params, 'ior', 1, 2, 0.01 )
					.onChange( function () {

						material.ior = params.ior;
						render();

					} );

				gui.add( params, 'thickness', 0, 5, 0.01 )
					.onChange( function () {

						material.thickness = params.thickness;
						render();

					} );

				gui.addColor( params, 'attenuationColor' )
					.name( 'attenuation color' )
					.onChange( function () {

						material.attenuationColor.set( params.attenuationColor );
						render();

					} );

				gui.add( params, 'attenuationDistance', 0, 1, 0.01 )
					.onChange( function () {

						material.attenuationDistance = params.attenuationDistance;
						render();

					} );

				gui.add( params, 'specularIntensity', 0, 1, 0.01 )
					.onChange( function () {

						material.specularIntensity = params.specularIntensity;
						render();

					} );

				gui.addColor( params, 'specularColor' )
					.onChange( function () {

						material.specularColor.set( params.specularColor );
						render();

					} );

				gui.add( params, 'envMapIntensity', 0, 1, 0.01 )
					.name( 'envMap intensity' )
					.onChange( function () {

						material.envMapIntensity = params.envMapIntensity;
						render();

					} );

				gui.add( params, 'exposure', 0, 1, 0.01 )
					.onChange( function () {

						renderer.toneMappingExposure = params.exposure;
						render();

					} );

				gui.open();

			}
			/* THREE_TOPIC_RESIZE_NOTE_START
			 * 窗口变化时不能只改 canvas 尺寸；相机 aspect / 投影矩阵 / renderer 尺寸通常都要一起更新，否则画面比例或交互坐标会出问题。
			 * THREE_TOPIC_RESIZE_NOTE_END */


			function onWindowResize() {

				const width = window.innerWidth;
				const height = window.innerHeight;

				camera.aspect = width / height;
				camera.updateProjectionMatrix();

				renderer.setSize( width, height );

				render();

			}

			//
			/* THREE_TOPIC_RENDER_NOTE_START
			 * render() 是最终绘制阶段。普通案例多用 renderer.render(scene, camera)，后处理案例会改用 composer.render，多视口案例会设置 viewport/scissor。
			 * THREE_TOPIC_RENDER_NOTE_END */


			function render() {

				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
