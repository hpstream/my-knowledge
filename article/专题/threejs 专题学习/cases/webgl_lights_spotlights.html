<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - lights - spot light</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgl - lights - spot light">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgl_lights_spotlights.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgl_lights_spotlights.jpg">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - SpotLights<br/>
			by <a href="http://master-domain.com" target="_blank" rel="noopener">Master James</a>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">
			
			/* THREE_TOPIC_LEARNING_NOTES_START
			 * 本注释由本地 Three.js 专题生成，保留官网案例代码结构，只补学习说明。
			 * 案例：webgl_lights_spotlights.html
			 * 分组：B｜光照材质
			 * 目标：学习多盏 SpotLight 如何共同照明，以及为什么多阴影光源会带来明显性能成本。
			 *
			 * 阅读顺序：先找 renderer 的 color/toneMapping/output 设置，再找 light / material / environment，最后看 GUI 参数如何改变光照或材质。光照材质类案例要重点观察“哪个参数改变了亮度、阴影、反射、透明或贴图清晰度”。
			 *
			 * 核心知识点：
			 * 1. 多个 SpotLight 可以形成舞台布光
			 * 2. 每盏灯都有自己的位置、方向和投影
			 * 3. 多盏 castShadow 的成本很高
			 * 4. 颜色叠加会影响材质观感
			 * 5. helper 能帮助调每盏灯的方向
			 *
			 * 本案例的关键代码片段，可以在下面源码中搜索这些语句：
			 *   const newObj = new THREE.SpotLight( color, 10 );
			 *   newObj.castShadow = true;
			 *   newObj.angle = 0.3;
			 *   newObj.penumbra = 0.2;
			 *   newObj.decay = 2;
			 *   newObj.distance = 50;
			 *
			 * 这些代码在做什么：
			 * 1. 这个案例适合理解“灯光组合”，不是只看单盏灯参数。
			 * 2. 多盏灯颜色混合后，物体颜色会被改变。
			 * 3. 每个开启阴影的 SpotLight 都需要额外渲染阴影贴图。
			 * 4. 在真实项目里，通常只让少数关键灯投影，其他灯只照明。
			 * 5. 多灯布光要配合曝光和 tone mapping，否则容易过曝。
			 *
			 * 学完后可以迁移到：
			 * 1. 舞台灯光系统
			 * 2. 展厅射灯
			 * 3. 游戏警示灯
			 * 4. 多车灯场景
			 * 5. 产品多灯棚拍
			 *
			 * 对应讲解文档：../官方案例讲解/B-光照材质/webgl_lights_spotlights.md
			 * THREE_TOPIC_LEARNING_NOTES_END */
import * as THREE from 'three';
			import TWEEN from 'three/addons/libs/tween.module.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

			const renderer = new THREE.WebGLRenderer( { antialias: true } );
			renderer.setPixelRatio( window.devicePixelRatio );
			renderer.setSize( window.innerWidth, window.innerHeight );
			renderer.setAnimationLoop( animate );

			const camera = new THREE.PerspectiveCamera( 35, window.innerWidth / window.innerHeight, 0.1, 100 );

			const controls = new OrbitControls( camera, renderer.domElement );

			const scene = new THREE.Scene();

			const matFloor = new THREE.MeshPhongMaterial( { color: 0x808080 } );
			const matBox = new THREE.MeshPhongMaterial( { color: 0xaaaaaa } );

			const geoFloor = new THREE.PlaneGeometry( 100, 100 );
			const geoBox = new THREE.BoxGeometry( 0.3, 0.1, 0.2 );

			const mshFloor = new THREE.Mesh( geoFloor, matFloor );
			mshFloor.rotation.x = - Math.PI * 0.5;
			const mshBox = new THREE.Mesh( geoBox, matBox );

			const ambient = new THREE.AmbientLight( 0x444444 );

			const spotLight1 = createSpotlight( 0xFF7F00 );
			const spotLight2 = createSpotlight( 0x00FF7F );
			const spotLight3 = createSpotlight( 0x7F00FF );

			let lightHelper1, lightHelper2, lightHelper3;
			/* THREE_TOPIC_INIT_NOTE_START
			 * init() 是案例搭建阶段：通常会创建 renderer、camera、scene、灯光、材质、模型、GUI 和事件。读这个函数时先看对象如何被创建和加入 scene。
			 * THREE_TOPIC_INIT_NOTE_END */


			function init() {

				renderer.shadowMap.enabled = true;
				renderer.shadowMap.type = THREE.PCFShadowMap;

				camera.position.set( 4.6, 2.2, - 2.1 );

				spotLight1.position.set( 1.5, 4, 4.5 );
				spotLight2.position.set( 0, 4, 3.5 );
				spotLight3.position.set( - 1.5, 4, 4.5 );

				lightHelper1 = new THREE.SpotLightHelper( spotLight1 );
				lightHelper2 = new THREE.SpotLightHelper( spotLight2 );
				lightHelper3 = new THREE.SpotLightHelper( spotLight3 );

				mshFloor.receiveShadow = true;
				mshFloor.position.set( 0, - 0.05, 0 );

				mshBox.castShadow = true;
				mshBox.receiveShadow = true;
				mshBox.position.set( 0, 0.5, 0 );

				scene.add( mshFloor );
				scene.add( mshBox );
				scene.add( ambient );
				scene.add( spotLight1, spotLight2, spotLight3 );
				scene.add( lightHelper1, lightHelper2, lightHelper3 );

				document.body.appendChild( renderer.domElement );
				window.addEventListener( 'resize', onWindowResize );

				controls.target.set( 0, 0.5, 0 );
				controls.maxPolarAngle = Math.PI / 2;
				controls.minDistance = 1;
				controls.maxDistance = 10;
				controls.update();

			}

			function createSpotlight( color ) {

				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：这个案例适合理解“灯光组合”，不是只看单盏灯参数。
				 * THREE_TOPIC_CORE_NOTE_END */
				const newObj = new THREE.SpotLight( color, 10 );

				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：多盏灯颜色混合后，物体颜色会被改变。
				 * THREE_TOPIC_CORE_NOTE_END */
				newObj.castShadow = true;
				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：每个开启阴影的 SpotLight 都需要额外渲染阴影贴图。
				 * THREE_TOPIC_CORE_NOTE_END */
				newObj.angle = 0.3;
				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：在真实项目里，通常只让少数关键灯投影，其他灯只照明。
				 * THREE_TOPIC_CORE_NOTE_END */
				newObj.penumbra = 0.2;
				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：多灯布光要配合曝光和 tone mapping，否则容易过曝。
				 * THREE_TOPIC_CORE_NOTE_END */
				newObj.decay = 2;
				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：多灯布光要配合曝光和 tone mapping，否则容易过曝。
				 * THREE_TOPIC_CORE_NOTE_END */
				newObj.distance = 50;

				return newObj;

			}
			/* THREE_TOPIC_RESIZE_NOTE_START
			 * 窗口变化时不能只改 canvas 尺寸；相机 aspect / 投影矩阵 / renderer 尺寸通常都要一起更新，否则画面比例或交互坐标会出问题。
			 * THREE_TOPIC_RESIZE_NOTE_END */


			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function tween( light ) {

				new TWEEN.Tween( light ).to( {
					angle: ( Math.random() * 0.7 ) + 0.1,
					penumbra: Math.random() + 1
				}, Math.random() * 3000 + 2000 )
					.easing( TWEEN.Easing.Quadratic.Out ).start();

				new TWEEN.Tween( light.position ).to( {
					x: ( Math.random() * 3 ) - 1.5,
					y: ( Math.random() * 1 ) + 1.5,
					z: ( Math.random() * 3 ) - 1.5
				}, Math.random() * 3000 + 2000 )
					.easing( TWEEN.Easing.Quadratic.Out ).start();

			}

			function updateTweens() {

				tween( spotLight1 );
				tween( spotLight2 );
				tween( spotLight3 );

				setTimeout( updateTweens, 5000 );

			}
			/* THREE_TOPIC_ANIMATE_NOTE_START
			 * animate() 是每帧循环入口。这里通常推进 controls、动画 mixer、物理世界或实例矩阵，然后触发 render。不要只看静态初始化，动态效果多数在这里发生。
			 * THREE_TOPIC_ANIMATE_NOTE_END */


			function animate() {

				TWEEN.update();

				if ( lightHelper1 ) lightHelper1.update();
				if ( lightHelper2 ) lightHelper2.update();
				if ( lightHelper3 ) lightHelper3.update();

				renderer.render( scene, camera );

			}

			init();
			updateTweens();

		</script>
	</body>
</html>
