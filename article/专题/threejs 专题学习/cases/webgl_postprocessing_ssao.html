<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - postprocessing - Screen Space Ambient Occlusion</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgl - postprocessing - Screen Space Ambient Occlusion">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgl_postprocessing_ssao.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgl_postprocessing_ssao.jpg">
		<link type="text/css" rel="stylesheet" href="main.css">
		<style>
			body {
				background-color: #aaa;
			}
		</style>
	</head>
	<body>
		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - screen space ambient occlusion<br/>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			
			/* THREE_TOPIC_LEARNING_NOTES_START
			 * 本注释由本地 Three.js 专题生成，保留官网案例代码结构，只补学习说明。
			 * 案例：webgl_postprocessing_ssao.html
			 * 分组：E｜性能大量对象和后处理
			 * 目标：学习屏幕空间环境遮蔽如何让接触处、缝隙和角落变暗，增强空间层次。
			 *
			 * 阅读顺序：先找 InstancedMesh / Points / EffectComposer，再看每帧更新的数据量。性能类案例要重点区分 CPU 创建对象、GPU draw call、纹理/后处理成本。
			 *
			 * 核心知识点：
			 * 1. SSAO 是后处理，不是真实阴影
			 * 2. 依赖深度和法线信息
			 * 3. kernel/radius 控制采样范围
			 * 4. 强度太高会显脏
			 * 5. 适合补足环境光过平的问题
			 *
			 * 本案例的关键代码片段，可以在下面源码中搜索这些语句：
			 *   const ssaoPass = new SSAOPass( scene, camera, width, height );
			 *   composer.addPass( ssaoPass );
			 *   
			 *   const outputPass = new OutputPass();
			 *   composer.addPass( outputPass );
			 *   
			 *   gui.add( ssaoPass, 'kernelRadius' ).min( 0 ).max( 32 );
			 *   gui.add( ssaoPass, 'minDistance' ).min( 0.001 ).max( 0.02 );
			 *   gui.add( ssaoPass, 'maxDistance' ).min( 0.01 ).max( 0.3 );
			 *
			 * 这些代码在做什么：
			 * 1. SSAO 根据屏幕上像素附近的深度关系推测遮蔽。
			 * 2. composer.addPass 把 SSAO 插入后处理流水线，原始场景渲染完后再计算遮蔽。
			 * 3. OutputPass 负责最后输出到屏幕，避免后处理结果停在中间纹理里。
			 * 4. kernelRadius 大，遮蔽范围大但成本和噪点风险也更高。
			 * 5. minDistance/maxDistance 控制哪些距离范围算遮蔽。
			 * 6. 因为是屏幕空间，屏幕外物体不会参与计算。
			 *
			 * 学完后可以迁移到：
			 * 1. 室内场景
			 * 2. 产品落地接触阴影
			 * 3. 游戏环境层次增强
			 * 4. 建筑可视化
			 * 5. 低成本真实感增强
			 *
			 * 对应讲解文档：../官方案例讲解/E-性能大量对象后处理/webgl_postprocessing_ssao.md
			 * THREE_TOPIC_LEARNING_NOTES_END */
import * as THREE from 'three';

			import Stats from 'three/addons/libs/stats.module.js';
			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

			import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
			import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
			import { SSAOPass } from 'three/addons/postprocessing/SSAOPass.js';
			import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

			let container, stats;
			let camera, scene, renderer;
			let composer;
			let group;

			init();
			/* THREE_TOPIC_INIT_NOTE_START
			 * init() 是案例搭建阶段：通常会创建 renderer、camera、scene、灯光、材质、模型、GUI 和事件。读这个函数时先看对象如何被创建和加入 scene。
			 * THREE_TOPIC_INIT_NOTE_END */


			function init() {

				container = document.createElement( 'div' );
				document.body.appendChild( container );

				renderer = new THREE.WebGLRenderer();
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				document.body.appendChild( renderer.domElement );

				camera = new THREE.PerspectiveCamera( 65, window.innerWidth / window.innerHeight, 100, 700 );
				camera.position.z = 500;

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0xaaaaaa );

				scene.add( new THREE.DirectionalLight( 0xffffff, 4 ) );
				scene.add( new THREE.AmbientLight( 0xffffff ) );

				group = new THREE.Group();
				scene.add( group );

				const geometry = new THREE.BoxGeometry( 10, 10, 10 );
				const material = new THREE.MeshLambertMaterial();

				const mesh = new THREE.InstancedMesh( geometry, material, 100 );
				const dummy = new THREE.Object3D();
				const color = new THREE.Color();

				for ( let i = 0; i < 100; i ++ ) {

					dummy.position.x = Math.random() * 400 - 200;
					dummy.position.y = Math.random() * 400 - 200;
					dummy.position.z = Math.random() * 400 - 200;
					dummy.rotation.x = Math.random();
					dummy.rotation.y = Math.random();
					dummy.rotation.z = Math.random();

					dummy.scale.setScalar( Math.random() * 10 + 2 );

					dummy.updateMatrix();
					mesh.setMatrixAt( i, dummy.matrix );

					color.setHex( Math.random() * 0xffffff );
					mesh.setColorAt( i, color );

				}

				group.add( mesh );

				stats = new Stats();
				container.appendChild( stats.dom );

				const width = window.innerWidth;
				const height = window.innerHeight;

				composer = new EffectComposer( renderer );

				const renderPass = new RenderPass( scene, camera );
				composer.addPass( renderPass );

				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：SSAO 根据屏幕上像素附近的深度关系推测遮蔽。
				 * THREE_TOPIC_CORE_NOTE_END */
				const ssaoPass = new SSAOPass( scene, camera, width, height );
				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：composer.addPass 把 SSAO 插入后处理流水线，原始场景渲染完后再计算遮蔽。
				 * THREE_TOPIC_CORE_NOTE_END */
				composer.addPass( ssaoPass );

				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：OutputPass 负责最后输出到屏幕，避免后处理结果停在中间纹理里。
				 * THREE_TOPIC_CORE_NOTE_END */
				const outputPass = new OutputPass();
				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：kernelRadius 大，遮蔽范围大但成本和噪点风险也更高。
				 * THREE_TOPIC_CORE_NOTE_END */
				composer.addPass( outputPass );

				// Init gui
				const gui = new GUI();

				gui.add( ssaoPass, 'output', {
					'Default': SSAOPass.OUTPUT.Default,
					'SSAO Only': SSAOPass.OUTPUT.SSAO,
					'SSAO Only + Blur': SSAOPass.OUTPUT.Blur,
					'Depth': SSAOPass.OUTPUT.Depth,
					'Normal': SSAOPass.OUTPUT.Normal
				} ).onChange( function ( value ) {

					ssaoPass.output = value;

				} );
				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：minDistance/maxDistance 控制哪些距离范围算遮蔽。
				 * THREE_TOPIC_CORE_NOTE_END */
				gui.add( ssaoPass, 'kernelRadius' ).min( 0 ).max( 32 );
				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：因为是屏幕空间，屏幕外物体不会参与计算。
				 * THREE_TOPIC_CORE_NOTE_END */
				gui.add( ssaoPass, 'minDistance' ).min( 0.001 ).max( 0.02 );
				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：因为是屏幕空间，屏幕外物体不会参与计算。
				 * THREE_TOPIC_CORE_NOTE_END */
				gui.add( ssaoPass, 'maxDistance' ).min( 0.01 ).max( 0.3 );
				gui.add( ssaoPass, 'enabled' );

				window.addEventListener( 'resize', onWindowResize );

			}
			/* THREE_TOPIC_RESIZE_NOTE_START
			 * 窗口变化时不能只改 canvas 尺寸；相机 aspect / 投影矩阵 / renderer 尺寸通常都要一起更新，否则画面比例或交互坐标会出问题。
			 * THREE_TOPIC_RESIZE_NOTE_END */


			function onWindowResize() {

				const width = window.innerWidth;
				const height = window.innerHeight;

				camera.aspect = width / height;
				camera.updateProjectionMatrix();

				renderer.setSize( width, height );
				composer.setSize( width, height );

			}
			/* THREE_TOPIC_ANIMATE_NOTE_START
			 * animate() 是每帧循环入口。这里通常推进 controls、动画 mixer、物理世界或实例矩阵，然后触发 render。不要只看静态初始化，动态效果多数在这里发生。
			 * THREE_TOPIC_ANIMATE_NOTE_END */


			function animate() {

				stats.begin();
				render();
				stats.end();

			}
			/* THREE_TOPIC_RENDER_NOTE_START
			 * render() 是最终绘制阶段。普通案例多用 renderer.render(scene, camera)，后处理案例会改用 composer.render，多视口案例会设置 viewport/scissor。
			 * THREE_TOPIC_RENDER_NOTE_END */


			function render() {

				const timer = performance.now();
				group.rotation.x = timer * 0.0002;
				group.rotation.y = timer * 0.0001;

				composer.render();

			}

		</script>
	</body>
</html>
