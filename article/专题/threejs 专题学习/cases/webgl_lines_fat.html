<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - lines - fat</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgl - lines - fat">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgl_lines_fat.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgl_lines_fat.jpg">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>

	<body>

		<div id="container"></div>

		<div id="info"><a href="https://threejs.org" target="_blank">three.js</a> - fat lines</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			
			/* THREE_TOPIC_LEARNING_NOTES_START
			 * 本注释由本地 Three.js 专题生成，保留官网案例代码结构，只补学习说明。
			 * 案例：webgl_lines_fat.html
			 * 分组：E｜性能大量对象和后处理
			 * 目标：学习 Line2/LineMaterial 如何实现屏幕空间粗线，并理解 resolution 对线宽计算的影响。
			 *
			 * 阅读顺序：先找 InstancedMesh / Points / EffectComposer，再看每帧更新的数据量。性能类案例要重点区分 CPU 创建对象、GPU draw call、纹理/后处理成本。
			 *
			 * 核心知识点：
			 * 1. WebGL 原生 Line 宽度支持有限
			 * 2. Line2 用几何方式模拟粗线
			 * 3. LineMaterial.linewidth 控制线宽
			 * 4. resolution 必须跟随窗口更新
			 * 5. 适合路线、轨迹、边框和测量线
			 *
			 * 本案例的关键代码片段，可以在下面源码中搜索这些语句：
			 *   const geometry = new LineGeometry();
			 *   geometry.setPositions( positions );
			 *   
			 *   matLine = new LineMaterial( {
			 *     color: 0xffffff,
			 *     linewidth: 5
			 *   } );
			 *   
			 *   line = new Line2( geometry, matLine );
			 *   line.computeLineDistances();
			 *   scene.add( line );
			 *
			 * 这些代码在做什么：
			 * 1. 普通 THREE.Line 在很多平台上 linewidth 基本不可控。
			 * 2. Line2/LineGeometry/LineMaterial 是 examples 里的粗线方案。
			 * 3. linewidth 是屏幕空间宽度，不是世界单位宽度。
			 * 4. resolution 用来把屏幕像素和线宽换算正确，窗口 resize 时必须更新。
			 * 5. 粗线本质更像带宽度的几何条带，成本高于普通 Line。
			 *
			 * 学完后可以迁移到：
			 * 1. 地图路径
			 * 2. 三维轨迹
			 * 3. CAD 边线
			 * 4. 流程连线
			 * 5. 测距和标注工具
			 *
			 * 对应讲解文档：../官方案例讲解/E-性能大量对象后处理/webgl_lines_fat.md
			 * THREE_TOPIC_LEARNING_NOTES_END */
import * as THREE from 'three';


			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { Line2 } from 'three/addons/lines/Line2.js';
			import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
			import { LineGeometry } from 'three/addons/lines/LineGeometry.js';
			import * as GeometryUtils from 'three/addons/utils/GeometryUtils.js';

			let line, renderer, scene, camera, camera2, controls;
			let line1;
			let matLine, matLineBasic, matLineDashed;
			let gui;

			// viewport
			let insetWidth;
			let insetHeight;

			init();
			/* THREE_TOPIC_INIT_NOTE_START
			 * init() 是案例搭建阶段：通常会创建 renderer、camera、scene、灯光、材质、模型、GUI 和事件。读这个函数时先看对象如何被创建和加入 scene。
			 * THREE_TOPIC_INIT_NOTE_END */


			function init() {

				renderer = new THREE.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setClearColor( 0x000000, 0.0 );
				renderer.setAnimationLoop( animate );
				document.body.appendChild( renderer.domElement );

				scene = new THREE.Scene();

				camera = new THREE.PerspectiveCamera( 40, window.innerWidth / window.innerHeight, 1, 1000 );
				camera.position.set( - 40, 0, 60 );

				camera2 = new THREE.PerspectiveCamera( 40, 1, 1, 1000 );
				camera2.position.copy( camera.position );

				controls = new OrbitControls( camera, renderer.domElement );
				controls.enableDamping = true;
				controls.minDistance = 10;
				controls.maxDistance = 500;


				// Position and THREE.Color Data

				const positions = [];
				const colors = [];

				const points = GeometryUtils.hilbert3D( new THREE.Vector3( 0, 0, 0 ), 20.0, 1, 0, 1, 2, 3, 4, 5, 6, 7 );

				const spline = new THREE.CatmullRomCurve3( points );
				const divisions = Math.round( 12 * points.length );
				const point = new THREE.Vector3();
				const color = new THREE.Color();

				for ( let i = 0, l = divisions; i < l; i ++ ) {

					const t = i / l;

					spline.getPoint( t, point );
					positions.push( point.x, point.y, point.z );

					color.setHSL( t, 1.0, 0.5, THREE.SRGBColorSpace );
					colors.push( color.r, color.g, color.b );

				}


				// Line2 ( LineGeometry, LineMaterial )

				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：普通 THREE.Line 在很多平台上 linewidth 基本不可控。
				 * THREE_TOPIC_CORE_NOTE_END */
				const geometry = new LineGeometry();
				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：Line2/LineGeometry/LineMaterial 是 examples 里的粗线方案。
				 * THREE_TOPIC_CORE_NOTE_END */
				geometry.setPositions( positions );
				geometry.setColors( colors );

				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：linewidth 是屏幕空间宽度，不是世界单位宽度。
				 * THREE_TOPIC_CORE_NOTE_END */
				matLine = new LineMaterial( {

					color: 0xffffff,
					linewidth: 5, // in world units with size attenuation, pixels otherwise
					vertexColors: true,

					dashed: false,
					alphaToCoverage: true,

				} );

				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：resolution 用来把屏幕像素和线宽换算正确，窗口 resize 时必须更新。
				 * THREE_TOPIC_CORE_NOTE_END */
				line = new Line2( geometry, matLine );
				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：粗线本质更像带宽度的几何条带，成本高于普通 Line。
				 * THREE_TOPIC_CORE_NOTE_END */
				line.computeLineDistances();
				line.scale.set( 1, 1, 1 );
				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：粗线本质更像带宽度的几何条带，成本高于普通 Line。
				 * THREE_TOPIC_CORE_NOTE_END */
				scene.add( line );


				// THREE.Line ( THREE.BufferGeometry, THREE.LineBasicMaterial ) - rendered with gl.LINE_STRIP

				const geo = new THREE.BufferGeometry();
				geo.setAttribute( 'position', new THREE.Float32BufferAttribute( positions, 3 ) );
				geo.setAttribute( 'color', new THREE.Float32BufferAttribute( colors, 3 ) );

				matLineBasic = new THREE.LineBasicMaterial( { vertexColors: true } );
				matLineDashed = new THREE.LineDashedMaterial( { vertexColors: true, scale: 2, dashSize: 1, gapSize: 1 } );

				line1 = new THREE.Line( geo, matLineBasic );
				line1.computeLineDistances();
				line1.visible = false;
				scene.add( line1 );

				//

				window.addEventListener( 'resize', onWindowResize );
				onWindowResize();

				initGui();

			}
			/* THREE_TOPIC_RESIZE_NOTE_START
			 * 窗口变化时不能只改 canvas 尺寸；相机 aspect / 投影矩阵 / renderer 尺寸通常都要一起更新，否则画面比例或交互坐标会出问题。
			 * THREE_TOPIC_RESIZE_NOTE_END */


			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

				insetWidth = window.innerHeight / 4; // square
				insetHeight = window.innerHeight / 4;

				camera2.aspect = insetWidth / insetHeight;
				camera2.updateProjectionMatrix();

			}
			/* THREE_TOPIC_ANIMATE_NOTE_START
			 * animate() 是每帧循环入口。这里通常推进 controls、动画 mixer、物理世界或实例矩阵，然后触发 render。不要只看静态初始化，动态效果多数在这里发生。
			 * THREE_TOPIC_ANIMATE_NOTE_END */


			function animate() {

				// main scene

				renderer.setClearColor( 0x000000, 0 );

				renderer.setViewport( 0, 0, window.innerWidth, window.innerHeight );

				controls.update();

				renderer.render( scene, camera );

				// inset scene

				renderer.setClearColor( 0x222222, 1 );

				renderer.clearDepth(); // important!

				renderer.setScissorTest( true );

				renderer.setScissor( 20, 20, insetWidth, insetHeight );

				renderer.setViewport( 20, 20, insetWidth, insetHeight );

				camera2.position.copy( camera.position );
				camera2.quaternion.copy( camera.quaternion );

				renderer.render( scene, camera2 );

				renderer.setScissorTest( false );

			}

			//

			function initGui() {

				gui = new GUI();

				const param = {
					'line type': 0,
					'world units': false,
					'width': 10,
					'alphaToCoverage': false,
					'dashed': false,
					'dash scale': 1,
					'dash / gap': 1
				};

				gui.add( param, 'line type', { 'LineGeometry': 0, 'gl.LINE': 1 } ).onChange( function ( val ) {

					switch ( val ) {

						case 0:
							line.visible = true;

							line1.visible = false;

							break;

						case 1:
							line.visible = false;

							line1.visible = true;

							break;

					}

				} );

				gui.add( param, 'world units' ).onChange( function ( val ) {

					matLine.worldUnits = val;
					matLine.needsUpdate = true;

					if ( val ) {

						widthController.name( 'width (world units)' ).min( 0.1 ).max( 0.5 ).setValue( 0.5 );

					} else {

						widthController.name( 'width (pixels)' ).min( 1 ).max( 10 ).setValue( 10 );
					}

				} );

				const widthController = gui.add( param, 'width', 1, 10 ).name( 'width (pixels)' ).onChange( function ( val ) {

					matLine.linewidth = val;

				} );

				gui.add( param, 'alphaToCoverage' ).onChange( function ( val ) {

					matLine.alphaToCoverage = val;

				} );

				gui.add( param, 'dashed' ).onChange( function ( val ) {

					matLine.dashed = val;
					line1.material = val ? matLineDashed : matLineBasic;

				} );

				gui.add( param, 'dash scale', 0.5, 2, 0.1 ).onChange( function ( val ) {

					matLine.dashScale = val;
					matLineDashed.scale = val;

				} );

				gui.add( param, 'dash / gap', { '2 : 1': 0, '1 : 1': 1, '1 : 2': 2 } ).onChange( function ( val ) {

					switch ( val ) {

						case 0:
							matLine.dashSize = 2;
							matLine.gapSize = 1;

							matLineDashed.dashSize = 2;
							matLineDashed.gapSize = 1;

							break;

						case 1:
							matLine.dashSize = 1;
							matLine.gapSize = 1;

							matLineDashed.dashSize = 1;
							matLineDashed.gapSize = 1;

							break;

						case 2:
							matLine.dashSize = 1;
							matLine.gapSize = 2;

							matLineDashed.dashSize = 1;
							matLineDashed.gapSize = 2;

							break;

					}

				} );

			}

		</script>

	</body>

</html>
