<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - lights - hemisphere light</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgl - lights - hemisphere light">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgl_lights_hemisphere.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgl_lights_hemisphere.jpg">
		<link type="text/css" rel="stylesheet" href="main.css">
		<style>
			body {
				color: #444;
			}
			a {
				color: #08f;
			}
		</style>
	</head>
	<body>

		<div id="container"></div>
		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - webgl hemisphere light example<br/>
			flamingo by <a href="https://mirada.com/" target="_blank" rel="noopener">mirada</a> from <a href="http://www.ro.me" target="_blank" rel="noopener">ro.me</a>
		</div>

		<script type="x-shader/x-vertex" id="vertexShader">

			varying vec3 vWorldPosition;

			void main() {

				vec4 worldPosition = modelMatrix * vec4( position, 1.0 );
				vWorldPosition = worldPosition.xyz;

				gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );

			}

		</script>

		<script type="x-shader/x-fragment" id="fragmentShader">

			uniform vec3 topColor;
			uniform vec3 bottomColor;
			uniform float offset;
			uniform float exponent;

			varying vec3 vWorldPosition;

			void main() {

				float h = normalize( vWorldPosition + offset ).y;
				gl_FragColor = vec4( mix( bottomColor, topColor, max( pow( max( h , 0.0), exponent ), 0.0 ) ), 1.0 );

			}

		</script>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			
			/* THREE_TOPIC_LEARNING_NOTES_START
			 * 本注释由本地 Three.js 专题生成，保留官网案例代码结构，只补学习说明。
			 * 案例：webgl_lights_hemisphere.html
			 * 分组：B｜光照材质
			 * 目标：学习半球光如何用天空色和地面色给户外模型补光，并与 DirectionalLight 共同形成自然日光。
			 *
			 * 阅读顺序：先找 renderer 的 color/toneMapping/output 设置，再找 light / material / environment，最后看 GUI 参数如何改变光照或材质。光照材质类案例要重点观察“哪个参数改变了亮度、阴影、反射、透明或贴图清晰度”。
			 *
			 * 核心知识点：
			 * 1. HemisphereLight 有天空色和地面色
			 * 2. 不会产生阴影
			 * 3. DirectionalLight 负责主光和阴影
			 * 4. ShaderMaterial 天空球只是背景
			 * 5. Fog 颜色需要和天空/地面气氛协调
			 *
			 * 本案例的关键代码片段，可以在下面源码中搜索这些语句：
			 *   const hemiLight = new THREE.HemisphereLight( 0xffffff, 0xffffff, 2 );
			 *   hemiLight.color.setHSL( 0.6, 1, 0.6 );
			 *   hemiLight.groundColor.setHSL( 0.095, 1, 0.75 );
			 *   scene.add( hemiLight );
			 *   
			 *   const dirLight = new THREE.DirectionalLight( 0xffffff, 3 );
			 *   dirLight.castShadow = true;
			 *   scene.add( dirLight );
			 *
			 * 这些代码在做什么：
			 * 1. hemiLight.color 是天空方向颜色，通常偏蓝。
			 * 2. groundColor 是地面反弹颜色，草地可偏黄绿，雪地可偏冷白。
			 * 3. HemisphereLight 没有精确方向，因此不投射阴影。
			 * 4. DirectionalLight 和 HemisphereLight 配合，才能同时有暗部补光和明确投影。
			 * 5. 天空球和 fog 是视觉环境，不等于半球光本身。
			 *
			 * 学完后可以迁移到：
			 * 1. 户外角色展示
			 * 2. 自然风景
			 * 3. 动物/车辆预览
			 * 4. 低成本日光环境
			 * 5. 天空地面色调控制
			 *
			 * 对应讲解文档：../官方案例讲解/B-光照材质/webgl_lights_hemisphere.md
			 * THREE_TOPIC_LEARNING_NOTES_END */
import * as THREE from 'three';

			import Stats from 'three/addons/libs/stats.module.js';
			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

			let camera, scene, renderer;
			const mixers = [];
			let stats;

			const timer = new THREE.Timer();
			timer.connect( document );

			init();
			/* THREE_TOPIC_INIT_NOTE_START
			 * init() 是案例搭建阶段：通常会创建 renderer、camera、scene、灯光、材质、模型、GUI 和事件。读这个函数时先看对象如何被创建和加入 scene。
			 * THREE_TOPIC_INIT_NOTE_END */


			function init() {

				const container = document.getElementById( 'container' );

				camera = new THREE.PerspectiveCamera( 30, window.innerWidth / window.innerHeight, 1, 5000 );
				camera.position.set( 0, 0, 250 );

				scene = new THREE.Scene();
				scene.background = new THREE.Color().setHSL( 0.6, 0, 1 );
				scene.fog = new THREE.Fog( scene.background, 1, 5000 );

				// LIGHTS

				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：hemiLight.color 是天空方向颜色，通常偏蓝。
				 * THREE_TOPIC_CORE_NOTE_END */
				const hemiLight = new THREE.HemisphereLight( 0xffffff, 0xffffff, 2 );
				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：groundColor 是地面反弹颜色，草地可偏黄绿，雪地可偏冷白。
				 * THREE_TOPIC_CORE_NOTE_END */
				hemiLight.color.setHSL( 0.6, 1, 0.6 );
				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：HemisphereLight 没有精确方向，因此不投射阴影。
				 * THREE_TOPIC_CORE_NOTE_END */
				hemiLight.groundColor.setHSL( 0.095, 1, 0.75 );
				hemiLight.position.set( 0, 50, 0 );
				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：DirectionalLight 和 HemisphereLight 配合，才能同时有暗部补光和明确投影。
				 * THREE_TOPIC_CORE_NOTE_END */
				scene.add( hemiLight );

				const hemiLightHelper = new THREE.HemisphereLightHelper( hemiLight, 10 );
				scene.add( hemiLightHelper );

				//

				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：天空球和 fog 是视觉环境，不等于半球光本身。
				 * THREE_TOPIC_CORE_NOTE_END */
				const dirLight = new THREE.DirectionalLight( 0xffffff, 3 );
				dirLight.color.setHSL( 0.1, 1, 0.95 );
				dirLight.position.set( - 1, 1.75, 1 );
				dirLight.position.multiplyScalar( 30 );
				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：天空球和 fog 是视觉环境，不等于半球光本身。
				 * THREE_TOPIC_CORE_NOTE_END */
				scene.add( dirLight );

				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：天空球和 fog 是视觉环境，不等于半球光本身。
				 * THREE_TOPIC_CORE_NOTE_END */
				dirLight.castShadow = true;

				dirLight.shadow.mapSize.width = 2048;
				dirLight.shadow.mapSize.height = 2048;

				const d = 50;

				dirLight.shadow.camera.left = - d;
				dirLight.shadow.camera.right = d;
				dirLight.shadow.camera.top = d;
				dirLight.shadow.camera.bottom = - d;

				dirLight.shadow.camera.far = 3500;
				dirLight.shadow.bias = - 0.0001;

				const dirLightHelper = new THREE.DirectionalLightHelper( dirLight, 10 );
				scene.add( dirLightHelper );

				// GROUND

				const groundGeo = new THREE.PlaneGeometry( 10000, 10000 );
				const groundMat = new THREE.MeshLambertMaterial( { color: 0xffffff } );
				groundMat.color.setHSL( 0.095, 1, 0.75 );

				const ground = new THREE.Mesh( groundGeo, groundMat );
				ground.position.y = - 33;
				ground.rotation.x = - Math.PI / 2;
				ground.receiveShadow = true;
				scene.add( ground );

				// SKYDOME

				const vertexShader = document.getElementById( 'vertexShader' ).textContent;
				const fragmentShader = document.getElementById( 'fragmentShader' ).textContent;
				const uniforms = {
					'topColor': { value: new THREE.Color( 0x0077ff ) },
					'bottomColor': { value: new THREE.Color( 0xffffff ) },
					'offset': { value: 33 },
					'exponent': { value: 0.6 }
				};
				uniforms[ 'topColor' ].value.copy( hemiLight.color );

				scene.fog.color.copy( uniforms[ 'bottomColor' ].value );

				const skyGeo = new THREE.SphereGeometry( 4000, 32, 15 );
				const skyMat = new THREE.ShaderMaterial( {
					uniforms: uniforms,
					vertexShader: vertexShader,
					fragmentShader: fragmentShader,
					side: THREE.BackSide
				} );

				const sky = new THREE.Mesh( skyGeo, skyMat );
				scene.add( sky );

				// MODEL

				const loader = new GLTFLoader();

				loader.load( 'models/gltf/Flamingo.glb', function ( gltf ) {

					const mesh = gltf.scene.children[ 0 ];

					const s = 0.35;
					mesh.scale.set( s, s, s );
					mesh.position.y = 15;
					mesh.rotation.y = - 1;

					mesh.castShadow = true;
					mesh.receiveShadow = true;

					scene.add( mesh );

					const mixer = new THREE.AnimationMixer( mesh );
					mixer.clipAction( gltf.animations[ 0 ] ).setDuration( 1 ).play();
					mixers.push( mixer );

				} );

				// RENDERER

				renderer = new THREE.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				container.appendChild( renderer.domElement );
				renderer.shadowMap.enabled = true;

				// STATS

				stats = new Stats();
				container.appendChild( stats.dom );

				//

				const params = {
					toggleHemisphereLight: function () {

						hemiLight.visible = ! hemiLight.visible;
						hemiLightHelper.visible = ! hemiLightHelper.visible;

					},
					toggleDirectionalLight: function () {

						dirLight.visible = ! dirLight.visible;
						dirLightHelper.visible = ! dirLightHelper.visible;

					},
					shadowIntensity: 1
				};

				const gui = new GUI();

				gui.add( params, 'toggleHemisphereLight' ).name( 'toggle hemisphere light' );
				gui.add( params, 'toggleDirectionalLight' ).name( 'toggle directional light' );
				gui.add( params, 'shadowIntensity', 0, 1 ).name( 'shadow intensity' ).onChange( ( value ) => {

					dirLight.shadow.intensity = value;

				} );
				gui.open();

				//

				window.addEventListener( 'resize', onWindowResize );

			}
			/* THREE_TOPIC_RESIZE_NOTE_START
			 * 窗口变化时不能只改 canvas 尺寸；相机 aspect / 投影矩阵 / renderer 尺寸通常都要一起更新，否则画面比例或交互坐标会出问题。
			 * THREE_TOPIC_RESIZE_NOTE_END */


			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			//
			/* THREE_TOPIC_ANIMATE_NOTE_START
			 * animate() 是每帧循环入口。这里通常推进 controls、动画 mixer、物理世界或实例矩阵，然后触发 render。不要只看静态初始化，动态效果多数在这里发生。
			 * THREE_TOPIC_ANIMATE_NOTE_END */


			function animate() {

				timer.update();

				render();
				stats.update();

			}
			/* THREE_TOPIC_RENDER_NOTE_START
			 * render() 是最终绘制阶段。普通案例多用 renderer.render(scene, camera)，后处理案例会改用 composer.render，多视口案例会设置 viewport/scissor。
			 * THREE_TOPIC_RENDER_NOTE_END */


			function render() {

				const delta = timer.getDelta();

				for ( let i = 0; i < mixers.length; i ++ ) {

					mixers[ i ].update( delta );

				}

				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
