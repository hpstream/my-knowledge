<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js css2d - label">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/css2d_label.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/css2d_label.jpg">
		<title>three.js css2d - label</title>
		<link type="text/css" rel="stylesheet" href="main.css">
		<style>
			.label {
				color: #FFF;
				font-family: sans-serif;
				padding: 2px;
				background: rgba( 0, 0, 0, .6 );
			}
		</style>
	</head>
	<body>
		<div id="info"><a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> css2d - label</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			
			/* THREE_TOPIC_LEARNING_NOTES_START
			 * 本注释由本地 Three.js 专题生成，保留官网案例代码结构，只补学习说明。
			 * 案例：css2d_label.html
			 * 分组：D｜交互编辑
			 * 目标：学习如何让普通 DOM 跟随 3D 对象移动，用于标注、热点、名称牌和信息浮层。
			 *
			 * 阅读顺序：先找事件监听和 Raycaster / Controls，再看命中结果如何改变对象。交互编辑类案例要重点理解“屏幕坐标如何变成 3D 操作”。
			 *
			 * 核心知识点：
			 * 1. CSS2DObject 把 DOM 包成 3D 对象
			 * 2. CSS2DRenderer 单独渲染 DOM 层
			 * 3. WebGLRenderer 和 CSS2DRenderer 需要同尺寸
			 * 4. 标签位置来自 Object3D 坐标
			 * 5. CSS2D 不会参与深度遮挡的真实渲染
			 *
			 * 本案例的关键代码片段，可以在下面源码中搜索这些语句：
			 *   const earthDiv = document.createElement( 'div' );
			 *   earthDiv.className = 'label';
			 *   earthDiv.textContent = 'Earth';
			 *   const earthLabel = new CSS2DObject( earthDiv );
			 *   earthLabel.position.set( 1.5 * EARTH_RADIUS, 0, 0 );
			 *   earth.add( earthLabel );
			 *   
			 *   labelRenderer = new CSS2DRenderer();
			 *   labelRenderer.setSize( window.innerWidth, window.innerHeight );
			 *   document.body.appendChild( labelRenderer.domElement );
			 *
			 * 这些代码在做什么：
			 * 1. CSS2DObject 本质是一个 Object3D，所以可以 add 到 mesh 或 group 上。
			 * 2. 标签的 position 是相对父对象的局部坐标。
			 * 3. CSS2DRenderer 渲染 DOM，不渲染 WebGL，因此它要和 WebGLRenderer 同步尺寸。
			 * 4. OrbitControls 通常绑定到 labelRenderer.domElement 或 renderer.domElement，避免 DOM 层挡住交互。
			 * 5. 如果需要 3D 遮挡、旋转、缩放，需要考虑 CSS3DRenderer 或 Sprite。
			 *
			 * 学完后可以迁移到：
			 * 1. 地图点位标签
			 * 2. 产品部件说明
			 * 3. 知识图谱热点
			 * 4. 建筑楼层标注
			 * 5. 设备状态面板
			 *
			 * 对应讲解文档：../官方案例讲解/D-交互编辑/css2d_label.md
			 * THREE_TOPIC_LEARNING_NOTES_END */
import * as THREE from 'three';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

			let gui;

			let camera, scene, renderer, labelRenderer;

			const layers = {

				'Toggle Name': function () {

					camera.layers.toggle( 0 );

				},
				'Toggle Mass': function () {

					camera.layers.toggle( 1 );

				},
				'Enable All': function () {

					camera.layers.enableAll();

				},

				'Disable All': function () {

					camera.layers.disableAll();

				}

			};

			const timer = new THREE.Timer();
			timer.connect( document );
			const textureLoader = new THREE.TextureLoader();

			let moon;

			init();
			animate();
			/* THREE_TOPIC_INIT_NOTE_START
			 * init() 是案例搭建阶段：通常会创建 renderer、camera、scene、灯光、材质、模型、GUI 和事件。读这个函数时先看对象如何被创建和加入 scene。
			 * THREE_TOPIC_INIT_NOTE_END */


			function init() {

				const EARTH_RADIUS = 1;
				const MOON_RADIUS = 0.27;

				camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 0.1, 200 );
				camera.position.set( 10, 5, 20 );
				camera.layers.enableAll();

				scene = new THREE.Scene();

				const dirLight = new THREE.DirectionalLight( 0xffffff, 3 );
				dirLight.position.set( 0, 0, 1 );
				dirLight.layers.enableAll();
				scene.add( dirLight );

				const axesHelper = new THREE.AxesHelper( 5 );
				axesHelper.layers.enableAll();
				scene.add( axesHelper );

				//

				const earthGeometry = new THREE.SphereGeometry( EARTH_RADIUS, 16, 16 );
				const earthMaterial = new THREE.MeshPhongMaterial( {
					specular: 0x333333,
					shininess: 5,
					map: textureLoader.load( 'textures/planets/earth_atmos_2048.jpg' ),
					specularMap: textureLoader.load( 'textures/planets/earth_specular_2048.jpg' ),
					normalMap: textureLoader.load( 'textures/planets/earth_normal_2048.jpg' ),
					normalScale: new THREE.Vector2( 0.85, 0.85 )
				} );
				earthMaterial.map.colorSpace = THREE.SRGBColorSpace;
				const earth = new THREE.Mesh( earthGeometry, earthMaterial );
				scene.add( earth );

				const moonGeometry = new THREE.SphereGeometry( MOON_RADIUS, 16, 16 );
				const moonMaterial = new THREE.MeshPhongMaterial( {
					shininess: 5,
					map: textureLoader.load( 'textures/planets/moon_1024.jpg' )
				} );
				moonMaterial.map.colorSpace = THREE.SRGBColorSpace;
				moon = new THREE.Mesh( moonGeometry, moonMaterial );
				scene.add( moon );

				//

				earth.layers.enableAll();
				moon.layers.enableAll();

				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：CSS2DObject 本质是一个 Object3D，所以可以 add 到 mesh 或 group 上。
				 * THREE_TOPIC_CORE_NOTE_END */
				const earthDiv = document.createElement( 'div' );
				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：标签的 position 是相对父对象的局部坐标。
				 * THREE_TOPIC_CORE_NOTE_END */
				earthDiv.className = 'label';
				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：CSS2DRenderer 渲染 DOM，不渲染 WebGL，因此它要和 WebGLRenderer 同步尺寸。
				 * THREE_TOPIC_CORE_NOTE_END */
				earthDiv.textContent = 'Earth';
				earthDiv.style.backgroundColor = 'transparent';

				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：OrbitControls 通常绑定到 labelRenderer.domElement 或 renderer.domElement，避免 DOM 层挡住交互。
				 * THREE_TOPIC_CORE_NOTE_END */
				const earthLabel = new CSS2DObject( earthDiv );
				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：如果需要 3D 遮挡、旋转、缩放，需要考虑 CSS3DRenderer 或 Sprite。
				 * THREE_TOPIC_CORE_NOTE_END */
				earthLabel.position.set( 1.5 * EARTH_RADIUS, 0, 0 );
				earthLabel.center.set( 0, 1 );
				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：如果需要 3D 遮挡、旋转、缩放，需要考虑 CSS3DRenderer 或 Sprite。
				 * THREE_TOPIC_CORE_NOTE_END */
				earth.add( earthLabel );
				earthLabel.layers.set( 0 );

				const earthMassDiv = document.createElement( 'div' );
				earthMassDiv.className = 'label';
				earthMassDiv.textContent = '5.97237e24 kg';
				earthMassDiv.style.backgroundColor = 'transparent';

				const earthMassLabel = new CSS2DObject( earthMassDiv );
				earthMassLabel.position.set( 1.5 * EARTH_RADIUS, 0, 0 );
				earthMassLabel.center.set( 0, 0 );
				earth.add( earthMassLabel );
				earthMassLabel.layers.set( 1 );

				const moonDiv = document.createElement( 'div' );
				moonDiv.className = 'label';
				moonDiv.textContent = 'Moon';
				moonDiv.style.backgroundColor = 'transparent';

				const moonLabel = new CSS2DObject( moonDiv );
				moonLabel.position.set( 1.5 * MOON_RADIUS, 0, 0 );
				moonLabel.center.set( 0, 1 );
				moon.add( moonLabel );
				moonLabel.layers.set( 0 );

				const moonMassDiv = document.createElement( 'div' );
				moonMassDiv.className = 'label';
				moonMassDiv.textContent = '7.342e22 kg';
				moonMassDiv.style.backgroundColor = 'transparent';

				const moonMassLabel = new CSS2DObject( moonMassDiv );
				moonMassLabel.position.set( 1.5 * MOON_RADIUS, 0, 0 );
				moonMassLabel.center.set( 0, 0 );
				moon.add( moonMassLabel );
				moonMassLabel.layers.set( 1 );

				//

				renderer = new THREE.WebGLRenderer();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				document.body.appendChild( renderer.domElement );

				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：如果需要 3D 遮挡、旋转、缩放，需要考虑 CSS3DRenderer 或 Sprite。
				 * THREE_TOPIC_CORE_NOTE_END */
				labelRenderer = new CSS2DRenderer();
				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：如果需要 3D 遮挡、旋转、缩放，需要考虑 CSS3DRenderer 或 Sprite。
				 * THREE_TOPIC_CORE_NOTE_END */
				labelRenderer.setSize( window.innerWidth, window.innerHeight );
				labelRenderer.domElement.style.position = 'absolute';
				labelRenderer.domElement.style.top = '0px';
				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：如果需要 3D 遮挡、旋转、缩放，需要考虑 CSS3DRenderer 或 Sprite。
				 * THREE_TOPIC_CORE_NOTE_END */
				document.body.appendChild( labelRenderer.domElement );

				const controls = new OrbitControls( camera, labelRenderer.domElement );
				controls.minDistance = 5;
				controls.maxDistance = 100;

				//

				window.addEventListener( 'resize', onWindowResize );

				initGui();

			}
			/* THREE_TOPIC_RESIZE_NOTE_START
			 * 窗口变化时不能只改 canvas 尺寸；相机 aspect / 投影矩阵 / renderer 尺寸通常都要一起更新，否则画面比例或交互坐标会出问题。
			 * THREE_TOPIC_RESIZE_NOTE_END */


			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;

				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

				labelRenderer.setSize( window.innerWidth, window.innerHeight );

			}
			/* THREE_TOPIC_ANIMATE_NOTE_START
			 * animate() 是每帧循环入口。这里通常推进 controls、动画 mixer、物理世界或实例矩阵，然后触发 render。不要只看静态初始化，动态效果多数在这里发生。
			 * THREE_TOPIC_ANIMATE_NOTE_END */



			function animate() {

				timer.update();

				requestAnimationFrame( animate );

				const elapsed = timer.getElapsed();

				moon.position.set( Math.sin( elapsed ) * 5, 0, Math.cos( elapsed ) * 5 );

				renderer.render( scene, camera );
				labelRenderer.render( scene, camera );

			}

			//

			function initGui() {

				gui = new GUI();

				gui.title( 'Camera Layers' );

				gui.add( layers, 'Toggle Name' );
				gui.add( layers, 'Toggle Mass' );
				gui.add( layers, 'Enable All' );
				gui.add( layers, 'Disable All' );

				gui.open();

			}

		</script>
	</body>
</html>
