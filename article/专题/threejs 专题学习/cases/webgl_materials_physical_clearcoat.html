<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - materials - clearcoat</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgl - materials - clearcoat">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgl_materials_physical_clearcoat.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgl_materials_physical_clearcoat.jpg">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<body>
		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> webgl - materials - clearcoat
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			
			/* THREE_TOPIC_LEARNING_NOTES_START
			 * 本注释由本地 Three.js 专题生成，保留官网案例代码结构，只补学习说明。
			 * 案例：webgl_materials_physical_clearcoat.html
			 * 分组：B｜光照材质
			 * 目标：学习 MeshPhysicalMaterial 的 clearcoat 如何在底层材质上再加一层透明高光层。
			 *
			 * 阅读顺序：先找 renderer 的 color/toneMapping/output 设置，再找 light / material / environment，最后看 GUI 参数如何改变光照或材质。光照材质类案例要重点观察“哪个参数改变了亮度、阴影、反射、透明或贴图清晰度”。
			 *
			 * 核心知识点：
			 * 1. clearcoat 是第二层表面反射
			 * 2. clearcoatRoughness 控制清漆层粗糙度
			 * 3. clearcoatNormalMap 可以和底层 normalMap 分开
			 * 4. 适合车漆、碳纤维、亮面保护层
			 * 5. 它不是透明玻璃
			 *
			 * 本案例的关键代码片段，可以在下面源码中搜索这些语句：
			 *   let material = new THREE.MeshPhysicalMaterial( {
			 *     clearcoat: 1.0,
			 *     clearcoatRoughness: 0.1,
			 *     metalness: 0.9,
			 *     roughness: 0.5,
			 *     normalMap: normalMap3,
			 *     normalScale: new THREE.Vector2( 0.15, 0.15 )
			 *   } );
			 *   clearcoatNormalMap: clearcoatNormalMap,
			 *
			 * 这些代码在做什么：
			 * 1. roughness 是底层材质粗糙度，clearcoatRoughness 是清漆层粗糙度。
			 * 2. clearcoat 高时，表面会出现额外一层高光。
			 * 3. clearcoatNormalMap 让清漆层也有自己的微表面方向。
			 * 4. 底层可以是金属、塑料、碳纤维，清漆层仍然是透明亮面。
			 * 5. 做玻璃不要用 clearcoat 冒充，需要 transmission。
			 *
			 * 学完后可以迁移到：
			 * 1. 汽车漆
			 * 2. 头盔外壳
			 * 3. 碳纤维
			 * 4. 亮面塑料
			 * 5. 钢琴烤漆
			 *
			 * 对应讲解文档：../官方案例讲解/B-光照材质/webgl_materials_physical_clearcoat.md
			 * THREE_TOPIC_LEARNING_NOTES_END */
import * as THREE from 'three';

			import Stats from 'three/addons/libs/stats.module.js';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { HDRCubeTextureLoader } from 'three/addons/loaders/HDRCubeTextureLoader.js';

			import { FlakesTexture } from 'three/addons/textures/FlakesTexture.js';

			let container, stats;

			let camera, scene, renderer;

			let particleLight;
			let group;

			init();
			/* THREE_TOPIC_INIT_NOTE_START
			 * init() 是案例搭建阶段：通常会创建 renderer、camera、scene、灯光、材质、模型、GUI 和事件。读这个函数时先看对象如何被创建和加入 scene。
			 * THREE_TOPIC_INIT_NOTE_END */


			function init() {

				container = document.createElement( 'div' );
				document.body.appendChild( container );

				camera = new THREE.PerspectiveCamera( 27, window.innerWidth / window.innerHeight, 0.25, 50 );
				camera.position.z = 10;

				scene = new THREE.Scene();

				group = new THREE.Group();
				scene.add( group );

				new HDRCubeTextureLoader()
					.setPath( 'textures/cube/pisaHDR/' )
					.load( [ 'px.hdr', 'nx.hdr', 'py.hdr', 'ny.hdr', 'pz.hdr', 'nz.hdr' ],
						function ( texture ) {

							const geometry = new THREE.SphereGeometry( .8, 64, 32 );

							const textureLoader = new THREE.TextureLoader();

							const diffuse = textureLoader.load( 'textures/carbon/Carbon.png' );
							diffuse.colorSpace = THREE.SRGBColorSpace;
							diffuse.wrapS = THREE.RepeatWrapping;
							diffuse.wrapT = THREE.RepeatWrapping;
							diffuse.repeat.x = 10;
							diffuse.repeat.y = 10;

							const normalMap = textureLoader.load( 'textures/carbon/Carbon_Normal.png' );
							normalMap.wrapS = THREE.RepeatWrapping;
							normalMap.wrapT = THREE.RepeatWrapping;
							normalMap.repeat.x = 10;
							normalMap.repeat.y = 10;

							const normalMap2 = textureLoader.load( 'textures/water/Water_1_M_Normal.jpg' );

							const normalMap3 = new THREE.CanvasTexture( new FlakesTexture() );
							normalMap3.wrapS = THREE.RepeatWrapping;
							normalMap3.wrapT = THREE.RepeatWrapping;
							normalMap3.repeat.x = 10;
							normalMap3.repeat.y = 6;
							normalMap3.anisotropy = 16;

							const normalMap4 = textureLoader.load( 'textures/golfball.jpg' );

							const clearcoatNormalMap = textureLoader.load( 'textures/pbr/Scratched_gold/Scratched_gold_01_1K_Normal.png' );

							// car paint

							/* THREE_TOPIC_CORE_NOTE_START
							 * 学习注释：roughness 是底层材质粗糙度，clearcoatRoughness 是清漆层粗糙度。
							 * THREE_TOPIC_CORE_NOTE_END */
							let material = new THREE.MeshPhysicalMaterial( {
								/* THREE_TOPIC_CORE_NOTE_START
								 * 学习注释：clearcoat 高时，表面会出现额外一层高光。
								 * THREE_TOPIC_CORE_NOTE_END */
								clearcoat: 1.0,
								/* THREE_TOPIC_CORE_NOTE_START
								 * 学习注释：clearcoatNormalMap 让清漆层也有自己的微表面方向。
								 * THREE_TOPIC_CORE_NOTE_END */
								clearcoatRoughness: 0.1,
								/* THREE_TOPIC_CORE_NOTE_START
								 * 学习注释：底层可以是金属、塑料、碳纤维，清漆层仍然是透明亮面。
								 * THREE_TOPIC_CORE_NOTE_END */
								metalness: 0.9,
								/* THREE_TOPIC_CORE_NOTE_START
								 * 学习注释：做玻璃不要用 clearcoat 冒充，需要 transmission。
								 * THREE_TOPIC_CORE_NOTE_END */
								roughness: 0.5,
								color: 0x0000ff,
								normalMap: normalMap3,
								/* THREE_TOPIC_CORE_NOTE_START
								 * 学习注释：做玻璃不要用 clearcoat 冒充，需要 transmission。
								 * THREE_TOPIC_CORE_NOTE_END */
								normalScale: new THREE.Vector2( 0.15, 0.15 )
							} );

							let mesh = new THREE.Mesh( geometry, material );
							mesh.position.x = - 1;
							mesh.position.y = 1;
							group.add( mesh );

							// fibers

							material = new THREE.MeshPhysicalMaterial( {
								roughness: 0.5,
								clearcoat: 1.0,
								clearcoatRoughness: 0.1,
								map: diffuse,
								normalMap: normalMap
							} );
							mesh = new THREE.Mesh( geometry, material );
							mesh.position.x = 1;
							mesh.position.y = 1;
							group.add( mesh );

							// golf

							material = new THREE.MeshPhysicalMaterial( {
								metalness: 0.0,
								roughness: 0.1,
								clearcoat: 1.0,
								normalMap: normalMap4,
								clearcoatNormalMap: clearcoatNormalMap,

								// y scale is negated to compensate for normal map handedness.
								clearcoatNormalScale: new THREE.Vector2( 2.0, - 2.0 )
							} );
							mesh = new THREE.Mesh( geometry, material );
							mesh.position.x = - 1;
							mesh.position.y = - 1;
							group.add( mesh );

							// clearcoat + normalmap

							material = new THREE.MeshPhysicalMaterial( {
								clearcoat: 1.0,
								metalness: 1.0,
								color: 0xff0000,
								normalMap: normalMap2,
								normalScale: new THREE.Vector2( 0.15, 0.15 ),
								clearcoatNormalMap: clearcoatNormalMap,

								// y scale is negated to compensate for normal map handedness.
								clearcoatNormalScale: new THREE.Vector2( 2.0, - 2.0 )
							} );
							mesh = new THREE.Mesh( geometry, material );
							mesh.position.x = 1;
							mesh.position.y = - 1;
							group.add( mesh );

							//

							scene.background = texture;
							scene.environment = texture;

						}

					);

				// LIGHTS

				particleLight = new THREE.Mesh(
					new THREE.SphereGeometry( .05, 8, 8 ),
					new THREE.MeshBasicMaterial( { color: 0xffffff } )
				);
				scene.add( particleLight );

				particleLight.add( new THREE.PointLight( 0xffffff, 30 ) );

				renderer = new THREE.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				container.appendChild( renderer.domElement );

				//

				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.toneMappingExposure = 1.25;

				//


				//

				stats = new Stats();
				container.appendChild( stats.dom );

				// EVENTS

				const controls = new OrbitControls( camera, renderer.domElement );
				controls.minDistance = 3;
				controls.maxDistance = 30;

				window.addEventListener( 'resize', onWindowResize );

			}

			//
			/* THREE_TOPIC_RESIZE_NOTE_START
			 * 窗口变化时不能只改 canvas 尺寸；相机 aspect / 投影矩阵 / renderer 尺寸通常都要一起更新，否则画面比例或交互坐标会出问题。
			 * THREE_TOPIC_RESIZE_NOTE_END */


			function onWindowResize() {

				const width = window.innerWidth;
				const height = window.innerHeight;

				camera.aspect = width / height;
				camera.updateProjectionMatrix();

				renderer.setSize( width, height );

			}

			//
			/* THREE_TOPIC_ANIMATE_NOTE_START
			 * animate() 是每帧循环入口。这里通常推进 controls、动画 mixer、物理世界或实例矩阵，然后触发 render。不要只看静态初始化，动态效果多数在这里发生。
			 * THREE_TOPIC_ANIMATE_NOTE_END */


			function animate() {
			
				render();

				stats.update();

			}
			/* THREE_TOPIC_RENDER_NOTE_START
			 * render() 是最终绘制阶段。普通案例多用 renderer.render(scene, camera)，后处理案例会改用 composer.render，多视口案例会设置 viewport/scissor。
			 * THREE_TOPIC_RENDER_NOTE_END */


			function render() {

				const timer = Date.now() * 0.00025;

				particleLight.position.x = Math.sin( timer * 7 ) * 3;
				particleLight.position.y = Math.cos( timer * 5 ) * 4;
				particleLight.position.z = Math.cos( timer * 3 ) * 3;

				for ( let i = 0; i < group.children.length; i ++ ) {

					const child = group.children[ i ];
					child.rotation.y += 0.005;

				}

				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
