<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - GLTFloader</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgl - GLTFloader">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgl_loader_gltf.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgl_loader_gltf.jpg">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>

	<body>
		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - GLTFLoader<br />
			<a href="https://hdrihaven.com/hdri/?h=royal_esplanade" target="_blank" rel="noopener">Royal Esplanade</a> from <a href="https://hdrihaven.com/" target="_blank" rel="noopener">HDRI Haven</a>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			
			/* THREE_TOPIC_LEARNING_NOTES_START
			 * 本注释由本地 Three.js 专题生成，保留官网案例代码结构，只补学习说明。
			 * 案例：webgl_loader_gltf.html
			 * 分组：C｜模型资产和动画
			 * 目标：学习真实 glTF 模型加载、环境贴图、动画播放，以及官方 fitCameraToSelection 如何用 Box3 自动把相机摆到合适距离。
			 *
			 * 阅读顺序：先找 loader 和模型路径，再看解码器/压缩纹理/环境贴图，最后看 AnimationMixer 或模型后处理。模型资产类案例要重点理解“资源怎么进来、进来后如何适配场景”。
			 *
			 * 核心知识点：
			 * 1. GLTFLoader 加载 glb/gltf
			 * 2. scene.environment 给 PBR 模型环境反射
			 * 3. Box3 计算模型尺寸和中心
			 * 4. AnimationMixer 播放模型自带动画
			 * 5. compileAsync 避免模型加入场景时卡顿
			 *
			 * 本案例的关键代码片段，可以在下面源码中搜索这些语句：
			 *   const loader = new GLTFLoader();
			 *   loader.load( url, async function ( gltf ) {
			 *     currentModel = gltf.scene;
			 *     await renderer.compileAsync( currentModel, camera, scene );
			 *     scene.add( currentModel );
			 *     fitCameraToSelection( camera, controls, currentModel );
			 *   
			 *     if ( gltf.animations.length > 0 ) {
			 *       mixer = new THREE.AnimationMixer( currentModel );
			 *       for ( const animation of gltf.animations ) {
			 *         mixer.clipAction( animation ).play();
			 *       }
			 *     }
			 *   } );
			 *
			 * 这些代码在做什么：
			 * 1. gltf.scene 是模型的根对象，通常是一个 Group，不一定只有一个 mesh。
			 * 2. compileAsync 会提前编译材质 shader，减少第一次显示时的卡顿。
			 * 3. fitCameraToSelection 用 Box3 计算模型中心和最大尺寸，再移动相机、更新 controls.target。
			 * 4. AnimationMixer 绑定到模型根对象，用 clipAction 播放模型携带的动画片段。
			 * 5. 本地镜像把官网远程模型列表改成本地 models/gltf 下的模型，避免离线打不开。
			 *
			 * 学完后可以迁移到：
			 * 1. 通用模型预览器
			 * 2. 商品 3D 展示
			 * 3. 自动适配任意模型上传
			 * 4. 角色动画预览
			 * 5. 资产审核工具
			 *
			 * 对应讲解文档：../官方案例讲解/C-模型资产动画/webgl_loader_gltf.md
			 * THREE_TOPIC_LEARNING_NOTES_END */
import * as THREE from 'three';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { UltraHDRLoader } from 'three/addons/loaders/UltraHDRLoader.js';
			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

			let camera, scene, renderer, controls;
			let currentModel, mixer;
			let currentLoadId = 0;

			const timer = new THREE.Timer();

			init();
			/* THREE_TOPIC_INIT_NOTE_START
			 * init() 是案例搭建阶段：通常会创建 renderer、camera、scene、灯光、材质、模型、GUI 和事件。读这个函数时先看对象如何被创建和加入 scene。
			 * THREE_TOPIC_INIT_NOTE_END */


			function init() {

				const container = document.createElement( 'div' );
				document.body.appendChild( container );

				camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 0.25, 20 );
				camera.position.set( - 1.8, 0.6, 2.7 );

				scene = new THREE.Scene();

				new UltraHDRLoader()
					.setPath( 'textures/equirectangular/' )
					.load( 'royal_esplanade_2k.hdr.jpg', function ( texture ) {

						texture.mapping = THREE.EquirectangularReflectionMapping;

						scene.background = texture;
						scene.environment = texture;

						render();

						// model

						fetch( 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/model-index.json' )
							.then( response => response.json() )
							.then( models => {

								const gui = new GUI();
								const modelNames = models.map( m => m.name );
								const params = { model: 'DamagedHelmet' };

								if ( ! modelNames.includes( params.model ) && modelNames.length > 0 ) {

									params.model = modelNames[ 0 ];

								}

								gui.add( params, 'model', modelNames ).onChange( name => {

									const modelInfo = models.find( m => m.name === name );
									loadModel( modelInfo );

								} );

								gui.add( scene, 'backgroundBlurriness', 0, 1 );

								const initialModel = models.find( m => m.name === params.model );
								if ( initialModel ) loadModel( initialModel );

							} );

					} );

				renderer = new THREE.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( render );
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				container.appendChild( renderer.domElement );

				controls = new OrbitControls( camera, renderer.domElement );
				controls.enableDamping = true;
				controls.minDistance = 2;
				controls.maxDistance = 10;
				controls.target.set( 0, 0, - 0.2 );
				controls.update();

				window.addEventListener( 'resize', onWindowResize );

			}

			function loadModel( modelInfo ) {

				const variants = modelInfo.variants;
				const variant = variants[ 'glTF-Binary' ] || variants[ 'glTF' ];
				const url = `https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/${ modelInfo.name }/${ variant.endsWith( '.glb' ) ? 'glTF-Binary' : 'glTF' }/${ variant }`;

				if ( currentModel ) {

					scene.remove( currentModel );
					currentModel = null;

				}

				if ( mixer ) {

					mixer.stopAllAction();
					mixer = null;

				}

				const loadId = ++ currentLoadId;

				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：gltf.scene 是模型的根对象，通常是一个 Group，不一定只有一个 mesh。
				 * THREE_TOPIC_CORE_NOTE_END */
				const loader = new GLTFLoader();
				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：compileAsync 会提前编译材质 shader，减少第一次显示时的卡顿。
				 * THREE_TOPIC_CORE_NOTE_END */
				loader.load( url, async function ( gltf ) {

					if ( loadId !== currentLoadId ) return;

					/* THREE_TOPIC_CORE_NOTE_START
					 * 学习注释：fitCameraToSelection 用 Box3 计算模型中心和最大尺寸，再移动相机、更新 controls.target。
					 * THREE_TOPIC_CORE_NOTE_END */
					currentModel = gltf.scene;

					// wait until the model can be added to the scene without blocking due to shader compilation

					/* THREE_TOPIC_CORE_NOTE_START
					 * 学习注释：AnimationMixer 绑定到模型根对象，用 clipAction 播放模型携带的动画片段。
					 * THREE_TOPIC_CORE_NOTE_END */
					await renderer.compileAsync( currentModel, camera, scene );

					if ( loadId !== currentLoadId ) return;

					/* THREE_TOPIC_CORE_NOTE_START
					 * 学习注释：本地镜像把官网远程模型列表改成本地 models/gltf 下的模型，避免离线打不开。
					 * THREE_TOPIC_CORE_NOTE_END */
					scene.add( currentModel );

					/* THREE_TOPIC_CORE_NOTE_START
					 * 学习注释：本地镜像把官网远程模型列表改成本地 models/gltf 下的模型，避免离线打不开。
					 * THREE_TOPIC_CORE_NOTE_END */
					fitCameraToSelection( camera, controls, currentModel );

					// animations

					/* THREE_TOPIC_CORE_NOTE_START
					 * 学习注释：本地镜像把官网远程模型列表改成本地 models/gltf 下的模型，避免离线打不开。
					 * THREE_TOPIC_CORE_NOTE_END */
					if ( gltf.animations.length > 0 ) {

						/* THREE_TOPIC_CORE_NOTE_START
						 * 学习注释：本地镜像把官网远程模型列表改成本地 models/gltf 下的模型，避免离线打不开。
						 * THREE_TOPIC_CORE_NOTE_END */
						mixer = new THREE.AnimationMixer( currentModel );

						/* THREE_TOPIC_CORE_NOTE_START
						 * 学习注释：本地镜像把官网远程模型列表改成本地 models/gltf 下的模型，避免离线打不开。
						 * THREE_TOPIC_CORE_NOTE_END */
						for ( const animation of gltf.animations ) {

							/* THREE_TOPIC_CORE_NOTE_START
							 * 学习注释：本地镜像把官网远程模型列表改成本地 models/gltf 下的模型，避免离线打不开。
							 * THREE_TOPIC_CORE_NOTE_END */
							mixer.clipAction( animation ).play();

						}

					}

				} );

			}

			function fitCameraToSelection( camera, controls, selection, fitOffset = 1.3 ) {

				const box = new THREE.Box3();
				box.setFromObject( selection );

				const size = box.getSize( new THREE.Vector3() );
				const center = box.getCenter( new THREE.Vector3() );

				const maxSize = Math.max( size.x, size.y, size.z );
				const fitHeightDistance = maxSize / ( 2 * Math.atan( Math.PI * camera.fov / 360 ) );
				// const fitWidthDistance = fitHeightDistance / camera.aspect;
				// const distance = fitOffset * Math.max( fitHeightDistance, fitWidthDistance );
				const distance = fitOffset * fitHeightDistance;

				const direction = controls.target.clone().sub( camera.position ).normalize().multiplyScalar( distance );

				controls.maxDistance = distance * 10;
				controls.minDistance = distance / 10;
				controls.target.copy( center );

				camera.near = distance / 100;
				camera.far = distance * 100;
				camera.updateProjectionMatrix();

				camera.position.copy( controls.target ).sub( direction );

				controls.update();

			}
			/* THREE_TOPIC_RESIZE_NOTE_START
			 * 窗口变化时不能只改 canvas 尺寸；相机 aspect / 投影矩阵 / renderer 尺寸通常都要一起更新，否则画面比例或交互坐标会出问题。
			 * THREE_TOPIC_RESIZE_NOTE_END */


			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

				render();

			}

			//
			/* THREE_TOPIC_RENDER_NOTE_START
			 * render() 是最终绘制阶段。普通案例多用 renderer.render(scene, camera)，后处理案例会改用 composer.render，多视口案例会设置 viewport/scissor。
			 * THREE_TOPIC_RENDER_NOTE_END */


			function render() {

				timer.update();

				controls.update();

				if ( mixer ) mixer.update( timer.getDelta() );

				renderer.render( scene, camera );

			}

		</script>

	</body>
</html>
