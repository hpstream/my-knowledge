<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - transform controls</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgl - transform controls">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/misc_controls_transform.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/misc_controls_transform.jpg">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<body>

		<div id="info">
			"W" translate | "E" rotate | "R" scale | "+/-" adjust size<br />
			"Q" toggle world/local space |  "Shift" hold to snap to grid<br />
			"X" toggle X | "Y" toggle Y | "Z" toggle Z | "Spacebar" toggle enabled<br />
			"Esc" reset current transform<br />
			"C" toggle camera | "V" random zoom
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			
			/* THREE_TOPIC_LEARNING_NOTES_START
			 * 本注释由本地 Three.js 专题生成，保留官网案例代码结构，只补学习说明。
			 * 案例：misc_controls_transform.html
			 * 分组：D｜交互编辑
			 * 目标：学习 3D 编辑器 gizmo 的基本实现：attach 目标对象、切换 translate/rotate/scale、世界/本地坐标和吸附。
			 *
			 * 阅读顺序：先找事件监听和 Raycaster / Controls，再看命中结果如何改变对象。交互编辑类案例要重点理解“屏幕坐标如何变成 3D 操作”。
			 *
			 * 核心知识点：
			 * 1. TransformControls 需要 attach 到目标 Object3D
			 * 2. getHelper 返回可显示的 gizmo
			 * 3. dragging-changed 用来暂停 OrbitControls
			 * 4. setMode 切换移动旋转缩放
			 * 5. setSpace 切换 local/world
			 *
			 * 本案例的关键代码片段，可以在下面源码中搜索这些语句：
			 *   control = new TransformControls( currentCamera, renderer.domElement );
			 *   control.addEventListener( 'dragging-changed', function ( event ) {
			 *     orbit.enabled = ! event.value;
			 *   } );
			 *   
			 *   control.attach( mesh );
			 *   const gizmo = control.getHelper();
			 *   scene.add( gizmo );
			 *   
			 *   control.setMode( 'translate' );
			 *   control.setSpace( control.space === 'local' ? 'world' : 'local' );
			 *
			 * 这些代码在做什么：
			 * 1. TransformControls 自身不是 mesh，它通过 getHelper 把控制手柄加入场景。
			 * 2. attach(mesh) 表示当前编辑目标是这个 mesh。
			 * 3. dragging-changed 为 true 时关闭 orbit，避免拖手柄时相机也旋转。
			 * 4. translate/rotate/scale 是编辑器三大基础模式。
			 * 5. local/world 决定坐标轴跟随物体旋转，还是保持世界坐标方向。
			 *
			 * 学完后可以迁移到：
			 * 1. 模型编辑器
			 * 2. 场景搭建器
			 * 3. 关卡编辑器
			 * 4. 室内设计工具
			 * 5. 可视化配置平台
			 *
			 * 对应讲解文档：../官方案例讲解/D-交互编辑/misc_controls_transform.md
			 * THREE_TOPIC_LEARNING_NOTES_END */
import * as THREE from 'three';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { TransformControls } from 'three/addons/controls/TransformControls.js';

			let cameraPersp, cameraOrtho, currentCamera;
			let scene, renderer, control, orbit;

			init();
			render();
			/* THREE_TOPIC_INIT_NOTE_START
			 * init() 是案例搭建阶段：通常会创建 renderer、camera、scene、灯光、材质、模型、GUI 和事件。读这个函数时先看对象如何被创建和加入 scene。
			 * THREE_TOPIC_INIT_NOTE_END */


			function init() {

				renderer = new THREE.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				document.body.appendChild( renderer.domElement );

				const aspect = window.innerWidth / window.innerHeight;

				const frustumSize = 5;

				cameraPersp = new THREE.PerspectiveCamera( 50, aspect, 0.1, 100 );
				cameraOrtho = new THREE.OrthographicCamera( - frustumSize * aspect, frustumSize * aspect, frustumSize, - frustumSize, 0.1, 100 );
				currentCamera = cameraPersp;

				currentCamera.position.set( 5, 2.5, 5 );

				scene = new THREE.Scene();
				scene.add( new THREE.GridHelper( 5, 10, 0x888888, 0x444444 ) );

				const ambientLight = new THREE.AmbientLight( 0xffffff );
				scene.add( ambientLight );

				const light = new THREE.DirectionalLight( 0xffffff, 4 );
				light.position.set( 1, 1, 1 );
				scene.add( light );

				const texture = new THREE.TextureLoader().load( 'textures/crate.gif', render );
				texture.colorSpace = THREE.SRGBColorSpace;
				texture.anisotropy = renderer.capabilities.getMaxAnisotropy();

				const geometry = new THREE.BoxGeometry();
				const material = new THREE.MeshLambertMaterial( { map: texture } );

				orbit = new OrbitControls( currentCamera, renderer.domElement );
				orbit.update();
				orbit.addEventListener( 'change', render );

				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：TransformControls 自身不是 mesh，它通过 getHelper 把控制手柄加入场景。
				 * THREE_TOPIC_CORE_NOTE_END */
				control = new TransformControls( currentCamera, renderer.domElement );
				control.addEventListener( 'change', render );
				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：attach(mesh) 表示当前编辑目标是这个 mesh。
				 * THREE_TOPIC_CORE_NOTE_END */
				control.addEventListener( 'dragging-changed', function ( event ) {

					/* THREE_TOPIC_CORE_NOTE_START
					 * 学习注释：dragging-changed 为 true 时关闭 orbit，避免拖手柄时相机也旋转。
					 * THREE_TOPIC_CORE_NOTE_END */
					orbit.enabled = ! event.value;

				} );

				const mesh = new THREE.Mesh( geometry, material );
				scene.add( mesh );

				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：translate/rotate/scale 是编辑器三大基础模式。
				 * THREE_TOPIC_CORE_NOTE_END */
				control.attach( mesh );

				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：local/world 决定坐标轴跟随物体旋转，还是保持世界坐标方向。
				 * THREE_TOPIC_CORE_NOTE_END */
				const gizmo = control.getHelper();
				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：local/world 决定坐标轴跟随物体旋转，还是保持世界坐标方向。
				 * THREE_TOPIC_CORE_NOTE_END */
				scene.add( gizmo );

				window.addEventListener( 'resize', onWindowResize );

				window.addEventListener( 'keydown', function ( event ) {

					switch ( event.key ) {

						case 'q':
							/* THREE_TOPIC_CORE_NOTE_START
							 * 学习注释：local/world 决定坐标轴跟随物体旋转，还是保持世界坐标方向。
							 * THREE_TOPIC_CORE_NOTE_END */
							control.setSpace( control.space === 'local' ? 'world' : 'local' );
							break;

						case 'Shift':
							control.setTranslationSnap( 1 );
							control.setRotationSnap( THREE.MathUtils.degToRad( 15 ) );
							control.setScaleSnap( 0.25 );
							break;

						case 'w':
							/* THREE_TOPIC_CORE_NOTE_START
							 * 学习注释：local/world 决定坐标轴跟随物体旋转，还是保持世界坐标方向。
							 * THREE_TOPIC_CORE_NOTE_END */
							control.setMode( 'translate' );
							break;

						case 'e':
							control.setMode( 'rotate' );
							break;

						case 'r':
							control.setMode( 'scale' );
							break;

						case 'c':
							const position = currentCamera.position.clone();

							currentCamera = currentCamera.isPerspectiveCamera ? cameraOrtho : cameraPersp;
							currentCamera.position.copy( position );

							orbit.object = currentCamera;
							control.camera = currentCamera;

							currentCamera.lookAt( orbit.target.x, orbit.target.y, orbit.target.z );
							onWindowResize();
							break;

						case 'v':
							const randomFoV = Math.random() + 0.1;
							const randomZoom = Math.random() + 0.1;

							cameraPersp.fov = randomFoV * 160;
							cameraOrtho.bottom = - randomFoV * 500;
							cameraOrtho.top = randomFoV * 500;

							cameraPersp.zoom = randomZoom * 5;
							cameraOrtho.zoom = randomZoom * 5;
							onWindowResize();
							break;

						case '+':
						case '=':
							control.setSize( control.size + 0.1 );
							break;

						case '-':
						case '_':
							control.setSize( Math.max( control.size - 0.1, 0.1 ) );
							break;

						case 'x':
							control.showX = ! control.showX;
							break;

						case 'y':
							control.showY = ! control.showY;
							break;

						case 'z':
							control.showZ = ! control.showZ;
							break;

						case ' ':
							control.enabled = ! control.enabled;
							break;

						case 'Escape':
							control.reset();
							break;

					}

				} );

				window.addEventListener( 'keyup', function ( event ) {

					switch ( event.key ) {

						case 'Shift':
							control.setTranslationSnap( null );
							control.setRotationSnap( null );
							control.setScaleSnap( null );
							break;

					}

				} );

			}
			/* THREE_TOPIC_RESIZE_NOTE_START
			 * 窗口变化时不能只改 canvas 尺寸；相机 aspect / 投影矩阵 / renderer 尺寸通常都要一起更新，否则画面比例或交互坐标会出问题。
			 * THREE_TOPIC_RESIZE_NOTE_END */


			function onWindowResize() {

				const aspect = window.innerWidth / window.innerHeight;

				cameraPersp.aspect = aspect;
				cameraPersp.updateProjectionMatrix();

				cameraOrtho.left = cameraOrtho.bottom * aspect;
				cameraOrtho.right = cameraOrtho.top * aspect;
				cameraOrtho.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

				render();

			}
			/* THREE_TOPIC_RENDER_NOTE_START
			 * render() 是最终绘制阶段。普通案例多用 renderer.render(scene, camera)，后处理案例会改用 composer.render，多视口案例会设置 viewport/scissor。
			 * THREE_TOPIC_RENDER_NOTE_END */


			function render() {

				renderer.render( scene, currentCamera );

			}

		</script>

	</body>
</html>
