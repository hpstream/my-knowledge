<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - materials - anisotropic texture filtering</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgl - materials - anisotropic texture filtering">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgl_materials_texture_anisotropy.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgl_materials_texture_anisotropy.jpg">
		<link type="text/css" rel="stylesheet" href="main.css">
		<style>
			body {
				color: #444;
			}
			a {
				color: #08f;
			}

			.lbl {
				color: #fff;
				font-size: 16px;
				font-weight: bold;
				position: absolute;
				bottom: 0px;
				z-index: 100;
				text-shadow: #000 1px 1px 1px;
				background-color: rgba(0,0,0,0.85);
				padding: 1em;
			}

			#lbl_left {
				text-align:left;
				left:0px;
			}

			#lbl_right {
				text-align:left;
				right:0px
			}

			.g { color:#aaa }
			.c { color:#fa0 }
		</style>
	</head>

	<body>
		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - anisotropic texture filtering example
		</div>

		<div id="lbl_left" class="lbl">
		anisotropy: <span class="c" id="val_left"></span><br/>
		</div>

		<div id="lbl_right" class="lbl">
		anisotropy: <span class="c" id="val_right"></span><br/>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			
			/* THREE_TOPIC_LEARNING_NOTES_START
			 * 本注释由本地 Three.js 专题生成，保留官网案例代码结构，只补学习说明。
			 * 案例：webgl_materials_texture_anisotropy.html
			 * 分组：B｜光照材质
			 * 目标：学习各向异性过滤如何改善斜视角下的地面、道路、跑道和长走廊贴图清晰度。
			 *
			 * 阅读顺序：先找 renderer 的 color/toneMapping/output 设置，再找 light / material / environment，最后看 GUI 参数如何改变光照或材质。光照材质类案例要重点观察“哪个参数改变了亮度、阴影、反射、透明或贴图清晰度”。
			 *
			 * 核心知识点：
			 * 1. anisotropy 主要改善斜视角
			 * 2. getMaxAnisotropy 获取设备上限
			 * 3. 高值更清晰但采样更贵
			 * 4. 不是所有贴图都需要开满
			 * 5. 通常用于地面、道路、长平面
			 *
			 * 本案例的关键代码片段，可以在下面源码中搜索这些语句：
			 *   const maxAnisotropy = renderer.capabilities.getMaxAnisotropy();
			 *   
			 *   texture1.anisotropy = maxAnisotropy;
			 *   texture1.wrapS = texture1.wrapT = THREE.RepeatWrapping;
			 *   texture1.repeat.set( 512, 512 );
			 *   
			 *   texture2.anisotropy = 1;
			 *
			 * 这些代码在做什么：
			 * 1. 斜着看地面时，一个屏幕像素对应纹理中又长又扁的一块区域。
			 * 2. 普通 mipmap 可能把远处细节平均糊掉。
			 * 3. anisotropy 会沿斜视方向做更好的采样，保留远处纹理细节。
			 * 4. getMaxAnisotropy 返回当前 GPU 支持的最大级别。
			 * 5. 高 anisotropy 有成本，应该优先给地面、道路等明显受益的贴图。
			 *
			 * 学完后可以迁移到：
			 * 1. 道路/跑道
			 * 2. 长走廊
			 * 3. 地砖/地毯
			 * 4. 赛车游戏地面
			 * 5. 大面积重复纹理
			 *
			 * 对应讲解文档：../官方案例讲解/B-光照材质/webgl_materials_texture_anisotropy.md
			 * THREE_TOPIC_LEARNING_NOTES_END */
import * as THREE from 'three';

			import Stats from 'three/addons/libs/stats.module.js';

			const SCREEN_WIDTH = window.innerWidth;
			const SCREEN_HEIGHT = window.innerHeight;

			let container, stats;

			let camera, scene1, scene2, renderer;

			let mouseX = 0, mouseY = 0;

			const windowHalfX = window.innerWidth / 2;
			const windowHalfY = window.innerHeight / 2;

			init();
			/* THREE_TOPIC_INIT_NOTE_START
			 * init() 是案例搭建阶段：通常会创建 renderer、camera、scene、灯光、材质、模型、GUI 和事件。读这个函数时先看对象如何被创建和加入 scene。
			 * THREE_TOPIC_INIT_NOTE_END */


			function init() {

				container = document.createElement( 'div' );
				document.body.appendChild( container );

				renderer = new THREE.WebGLRenderer( { antialias: true } );

				//

				camera = new THREE.PerspectiveCamera( 35, SCREEN_WIDTH / SCREEN_HEIGHT, 1, 25000 );
				camera.position.z = 1500;

				scene1 = new THREE.Scene();
				scene1.background = new THREE.Color( 0xf2f7ff );
				scene1.fog = new THREE.Fog( 0xf2f7ff, 1, 25000 );

				scene2 = new THREE.Scene();
				scene2.background = new THREE.Color( 0xf2f7ff );
				scene2.fog = new THREE.Fog( 0xf2f7ff, 1, 25000 );

				scene1.add( new THREE.AmbientLight( 0xeef0ff, 3 ) );
				scene2.add( new THREE.AmbientLight( 0xeef0ff, 3 ) );

				const light1 = new THREE.DirectionalLight( 0xffffff, 6 );
				light1.position.set( 1, 1, 1 );
				scene1.add( light1 );

				const light2 = new THREE.DirectionalLight( 0xffffff, 6 );
				light2.position.set( 1, 1, 1 );
				scene2.add( light2 );

				// GROUND

				const textureLoader = new THREE.TextureLoader();

				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：斜着看地面时，一个屏幕像素对应纹理中又长又扁的一块区域。
				 * THREE_TOPIC_CORE_NOTE_END */
				const maxAnisotropy = renderer.capabilities.getMaxAnisotropy();

				const texture1 = textureLoader.load( 'textures/crate.gif' );
				const material1 = new THREE.MeshPhongMaterial( { color: 0xffffff, map: texture1 } );

				texture1.colorSpace = THREE.SRGBColorSpace;
				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：普通 mipmap 可能把远处细节平均糊掉。
				 * THREE_TOPIC_CORE_NOTE_END */
				texture1.anisotropy = maxAnisotropy;
				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：anisotropy 会沿斜视方向做更好的采样，保留远处纹理细节。
				 * THREE_TOPIC_CORE_NOTE_END */
				texture1.wrapS = texture1.wrapT = THREE.RepeatWrapping;
				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：getMaxAnisotropy 返回当前 GPU 支持的最大级别。
				 * THREE_TOPIC_CORE_NOTE_END */
				texture1.repeat.set( 512, 512 );

				const texture2 = textureLoader.load( 'textures/crate.gif' );
				const material2 = new THREE.MeshPhongMaterial( { color: 0xffffff, map: texture2 } );

				texture2.colorSpace = THREE.SRGBColorSpace;
				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：高 anisotropy 有成本，应该优先给地面、道路等明显受益的贴图。
				 * THREE_TOPIC_CORE_NOTE_END */
				texture2.anisotropy = 1;
				texture2.wrapS = texture2.wrapT = THREE.RepeatWrapping;
				texture2.repeat.set( 512, 512 );

				if ( maxAnisotropy > 0 ) {

					document.getElementById( 'val_left' ).innerHTML = texture1.anisotropy;
					document.getElementById( 'val_right' ).innerHTML = texture2.anisotropy;

				} else {

					document.getElementById( 'val_left' ).innerHTML = 'not supported';
					document.getElementById( 'val_right' ).innerHTML = 'not supported';

				}

				//

				const geometry = new THREE.PlaneGeometry( 100, 100 );

				const mesh1 = new THREE.Mesh( geometry, material1 );
				mesh1.rotation.x = - Math.PI / 2;
				mesh1.scale.set( 1000, 1000, 1000 );

				const mesh2 = new THREE.Mesh( geometry, material2 );
				mesh2.rotation.x = - Math.PI / 2;
				mesh2.scale.set( 1000, 1000, 1000 );

				scene1.add( mesh1 );
				scene2.add( mesh2 );

				// RENDERER

				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( SCREEN_WIDTH, SCREEN_HEIGHT );
				renderer.setAnimationLoop( animate );
				renderer.autoClear = false;

				renderer.domElement.style.position = 'relative';
				container.appendChild( renderer.domElement );

				// STATS1

				stats = new Stats();
				container.appendChild( stats.dom );

				document.addEventListener( 'mousemove', onDocumentMouseMove );

			}


			function onDocumentMouseMove( event ) {

				mouseX = ( event.clientX - windowHalfX );
				mouseY = ( event.clientY - windowHalfY );

			}
			/* THREE_TOPIC_ANIMATE_NOTE_START
			 * animate() 是每帧循环入口。这里通常推进 controls、动画 mixer、物理世界或实例矩阵，然后触发 render。不要只看静态初始化，动态效果多数在这里发生。
			 * THREE_TOPIC_ANIMATE_NOTE_END */



			function animate() {

				render();
				stats.update();

			}
			/* THREE_TOPIC_RENDER_NOTE_START
			 * render() 是最终绘制阶段。普通案例多用 renderer.render(scene, camera)，后处理案例会改用 composer.render，多视口案例会设置 viewport/scissor。
			 * THREE_TOPIC_RENDER_NOTE_END */


			function render() {

				camera.position.x += ( mouseX - camera.position.x ) * .05;
				camera.position.y = THREE.MathUtils.clamp( camera.position.y + ( - ( mouseY - 200 ) - camera.position.y ) * .05, 50, 1000 );

				camera.lookAt( scene1.position );

				renderer.clear();
				renderer.setScissorTest( true );

				renderer.setScissor( 0, 0, SCREEN_WIDTH / 2 - 2, SCREEN_HEIGHT );
				renderer.render( scene1, camera );

				renderer.setScissor( SCREEN_WIDTH / 2, 0, SCREEN_WIDTH / 2 - 2, SCREEN_HEIGHT );
				renderer.render( scene2, camera );

				renderer.setScissorTest( false );


			}

		</script>

	</body>
</html>
