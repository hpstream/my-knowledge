<!DOCTYPE html>
<html lang="en">
	<head>
		<title>threejs webgl - materials - transmission</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="threejs webgl - materials - transmission">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgl_materials_physical_transmission.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgl_materials_physical_transmission.jpg">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<body>

		<div id="container"></div>
		<div id="info"><a href="https://threejs.org" target="_blank" rel="noopener">threejs</a> - Transmission</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			
			/* THREE_TOPIC_LEARNING_NOTES_START
			 * 本注释由本地 Three.js 专题生成，保留官网案例代码结构，只补学习说明。
			 * 案例：webgl_materials_physical_transmission.html
			 * 分组：B｜光照材质
			 * 目标：学习 MeshPhysicalMaterial 的 transmission、ior、thickness、roughness 如何共同形成玻璃和透明塑料质感。
			 *
			 * 阅读顺序：先找 renderer 的 color/toneMapping/output 设置，再找 light / material / environment，最后看 GUI 参数如何改变光照或材质。光照材质类案例要重点观察“哪个参数改变了亮度、阴影、反射、透明或贴图清晰度”。
			 *
			 * 核心知识点：
			 * 1. transmission 表示光穿过材质
			 * 2. opacity 只是混合透明
			 * 3. ior 控制折射率
			 * 4. thickness 控制厚度效果
			 * 5. 玻璃强依赖 environment
			 *
			 * 本案例的关键代码片段，可以在下面源码中搜索这些语句：
			 *   const material = new THREE.MeshPhysicalMaterial( {
			 *     roughness: params.roughness,
			 *     ior: params.ior,
			 *     alphaMap: texture,
			 *     envMap: hdrEquirect,
			 *     transmission: params.transmission, // use material.transmission for glass materials
			 *     transparent: true
			 *   } );
			 *
			 * 这些代码在做什么：
			 * 1. transmission 高时，背景和环境可以穿过材质参与渲染。
			 * 2. opacity 低只是把物体透明混合，不等于真实玻璃。
			 * 3. ior 是折射率，影响光线弯折感，不是亮度参数。
			 * 4. thickness 让透明材质有体积感，厚玻璃和薄膜观感不同。
			 * 5. 没有环境贴图时，玻璃通常很难看出质感。
			 *
			 * 学完后可以迁移到：
			 * 1. 玻璃杯
			 * 2. 展示柜
			 * 3. 亚克力
			 * 4. 透明按钮
			 * 5. 手机镜头
			 *
			 * 对应讲解文档：../官方案例讲解/B-光照材质/webgl_materials_physical_transmission.md
			 * THREE_TOPIC_LEARNING_NOTES_END */
import * as THREE from 'three';

			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { UltraHDRLoader } from 'three/addons/loaders/UltraHDRLoader.js';

			const params = {
				color: 0xffffff,
				transmission: 1,
				opacity: 1,
				metalness: 0,
				roughness: 0,
				ior: 1.5,
				thickness: 0.01,
				specularIntensity: 1,
				specularColor: 0xffffff,
				envMapIntensity: 1,
				lightIntensity: 1,
				exposure: 1,
				transmissionResolutionScale: 1
			};

			let camera, scene, renderer;

			let mesh;

			const hdrEquirect = new UltraHDRLoader()
				.setPath( 'textures/equirectangular/' )
				.load( 'royal_esplanade_2k.hdr.jpg', function () {

					hdrEquirect.mapping = THREE.EquirectangularReflectionMapping;

					init();
					render();

				} );
			/* THREE_TOPIC_INIT_NOTE_START
			 * init() 是案例搭建阶段：通常会创建 renderer、camera、scene、灯光、材质、模型、GUI 和事件。读这个函数时先看对象如何被创建和加入 scene。
			 * THREE_TOPIC_INIT_NOTE_END */


			function init() {

				renderer = new THREE.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.shadowMap.enabled = true;
				document.body.appendChild( renderer.domElement );

				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.toneMappingExposure = params.exposure;


				scene = new THREE.Scene();

				camera = new THREE.PerspectiveCamera( 40, window.innerWidth / window.innerHeight, 1, 2000 );
				camera.position.set( 0, 0, 120 );

				//

				scene.background = hdrEquirect;

				//

				const geometry = new THREE.SphereGeometry( 20, 64, 32 );

				const texture = new THREE.CanvasTexture( generateTexture() );
				texture.magFilter = THREE.NearestFilter;
				texture.wrapT = THREE.RepeatWrapping;
				texture.wrapS = THREE.RepeatWrapping;
				texture.repeat.set( 1, 3.5 );

				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：transmission 高时，背景和环境可以穿过材质参与渲染。
				 * THREE_TOPIC_CORE_NOTE_END */
				const material = new THREE.MeshPhysicalMaterial( {
					color: params.color,
					metalness: params.metalness,
					/* THREE_TOPIC_CORE_NOTE_START
					 * 学习注释：opacity 低只是把物体透明混合，不等于真实玻璃。
					 * THREE_TOPIC_CORE_NOTE_END */
					roughness: params.roughness,
					/* THREE_TOPIC_CORE_NOTE_START
					 * 学习注释：ior 是折射率，影响光线弯折感，不是亮度参数。
					 * THREE_TOPIC_CORE_NOTE_END */
					ior: params.ior,
					alphaMap: texture,
					envMap: hdrEquirect,
					envMapIntensity: params.envMapIntensity,
					/* THREE_TOPIC_CORE_NOTE_START
					 * 学习注释：thickness 让透明材质有体积感，厚玻璃和薄膜观感不同。
					 * THREE_TOPIC_CORE_NOTE_END */
					transmission: params.transmission, // use material.transmission for glass materials
					specularIntensity: params.specularIntensity,
					specularColor: params.specularColor,
					opacity: params.opacity,
					side: THREE.DoubleSide,
					transparent: true
				} );

				mesh = new THREE.Mesh( geometry, material );
				scene.add( mesh );

				//

				const controls = new OrbitControls( camera, renderer.domElement );
				controls.addEventListener( 'change', render ); // use if there is no animation loop
				controls.minDistance = 10;
				controls.maxDistance = 150;

				window.addEventListener( 'resize', onWindowResize );

				//

				const gui = new GUI();

				gui.addColor( params, 'color' )
					.onChange( function () {

						material.color.set( params.color );
						render();

					} );

				gui.add( params, 'transmission', 0, 1, 0.01 )
					.onChange( function () {

						material.transmission = params.transmission;
						render();

					} );

				gui.add( params, 'opacity', 0, 1, 0.01 )
					.onChange( function () {

						material.opacity = params.opacity;
						render();

					} );

				gui.add( params, 'metalness', 0, 1, 0.01 )
					.onChange( function () {

						material.metalness = params.metalness;
						render();

					} );

				gui.add( params, 'roughness', 0, 1, 0.01 )
					.onChange( function () {

						material.roughness = params.roughness;
						render();

					} );

				gui.add( params, 'ior', 1, 2, 0.01 )
					.onChange( function () {

						material.ior = params.ior;
						render();

					} );

				gui.add( params, 'thickness', 0, 5, 0.01 )
					.onChange( function () {

						material.thickness = params.thickness;
						render();

					} );

				gui.add( params, 'specularIntensity', 0, 1, 0.01 )
					.onChange( function () {

						material.specularIntensity = params.specularIntensity;
						render();

					} );

				gui.addColor( params, 'specularColor' )
					.onChange( function () {

						material.specularColor.set( params.specularColor );
						render();

					} );

				gui.add( params, 'envMapIntensity', 0, 1, 0.01 )
					.name( 'envMap intensity' )
					.onChange( function () {

						material.envMapIntensity = params.envMapIntensity;
						render();

					} );

				gui.add( params, 'exposure', 0, 1, 0.01 )
					.onChange( function () {

						renderer.toneMappingExposure = params.exposure;
						render();

					} );

				gui.add( params, 'transmissionResolutionScale', 0.01, 1, 0.01 )
					.name( 'transmission resolution' )
					.onChange( function () {

						renderer.transmissionResolutionScale = params.transmissionResolutionScale;
						render();

					} );

				gui.open();

			}
			/* THREE_TOPIC_RESIZE_NOTE_START
			 * 窗口变化时不能只改 canvas 尺寸；相机 aspect / 投影矩阵 / renderer 尺寸通常都要一起更新，否则画面比例或交互坐标会出问题。
			 * THREE_TOPIC_RESIZE_NOTE_END */


			function onWindowResize() {

				const width = window.innerWidth;
				const height = window.innerHeight;

				camera.aspect = width / height;
				camera.updateProjectionMatrix();

				renderer.setSize( width, height );

				render();

			}

			//

			function generateTexture() {

				const canvas = document.createElement( 'canvas' );
				canvas.width = 2;
				canvas.height = 2;

				const context = canvas.getContext( '2d' );
				context.fillStyle = 'white';
				context.fillRect( 0, 1, 2, 1 );

				return canvas;

			}
			/* THREE_TOPIC_RENDER_NOTE_START
			 * render() 是最终绘制阶段。普通案例多用 renderer.render(scene, camera)，后处理案例会改用 composer.render，多视口案例会设置 viewport/scissor。
			 * THREE_TOPIC_RENDER_NOTE_END */


			function render() {

				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
