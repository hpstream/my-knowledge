<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - helpers</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgl - helpers">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgl_helpers.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgl_helpers.jpg">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<body>
		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - helpers
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			
			/* THREE_TOPIC_LEARNING_NOTES_START
			 * 本注释由本地 Three.js 专题生成，保留官网案例代码结构，只补学习说明。
			 * 案例：webgl_helpers.html
			 * 分组：A｜观察调试
			 * 目标：学习如何用 helper 建立空间方向感，并用 BoxHelper 看清对象、group 和整个 scene 的真实包围范围。
			 *
			 * 阅读顺序：先找 camera / controls / helper，再看 resize 和每帧 controls.update。观察调试类案例的重点不是画面多复杂，而是你能不能判断相机、坐标、尺寸和包围范围是否正确。
			 *
			 * 核心知识点：
			 * 1. GridHelper 提供地面尺度
			 * 2. PolarGridHelper 提供环形坐标参照
			 * 3. BoxHelper 可以包住 Mesh、Line、Group、Scene
			 * 4. helper 是调试对象，不是业务模型
			 * 5. GLTFLoader 加载模型后也可以立刻加 helper 检查尺寸
			 *
			 * 本案例的关键代码片段，可以在下面源码中搜索这些语句：
			 *   const gridHelper = new THREE.GridHelper( 400, 40, 0x0000ff, 0x808080 );
			 *   scene.add( gridHelper );
			 *   
			 *   loader.load( 'models/gltf/LeePerrySmith/LeePerrySmith.glb', function ( gltf ) {
			 *     const mesh = gltf.scene.children[ 0 ];
			 *     group.add( mesh );
			 *     scene.add( new THREE.BoxHelper( mesh ) );
			 *   } );
			 *
			 * 这些代码在做什么：
			 * 1. GridHelper 的第一个参数是总尺寸，第二个参数是分段数量。
			 * 2. BoxHelper 会根据对象当前世界矩阵计算包围盒，因此能快速发现模型尺寸过大、偏移或旋转异常。
			 * 3. BoxHelper 包住 Group 时，会包含所有子对象。
			 * 4. BoxHelper 包住 Scene 时，会把场景中所有可见对象作为整体范围。
			 * 5. 项目上线通常隐藏 helper，但开发期应该大量使用它们。
			 *
			 * 学完后可以迁移到：
			 * 1. 模型导入调试
			 * 2. 自动居中前的尺寸检查
			 * 3. 编辑器辅助线
			 * 4. 碰撞体范围核对
			 * 5. 场景坐标教学
			 *
			 * 对应讲解文档：../官方案例讲解/A-观察调试/webgl_helpers.md
			 * THREE_TOPIC_LEARNING_NOTES_END */
import * as THREE from 'three';

			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

			import { VertexNormalsHelper } from 'three/addons/helpers/VertexNormalsHelper.js';
			import { VertexTangentsHelper } from 'three/addons/helpers/VertexTangentsHelper.js';

			let scene, renderer;
			let camera, light;
			let vnh;
			let vth;

			init();
			/* THREE_TOPIC_INIT_NOTE_START
			 * init() 是案例搭建阶段：通常会创建 renderer、camera、scene、灯光、材质、模型、GUI 和事件。读这个函数时先看对象如何被创建和加入 scene。
			 * THREE_TOPIC_INIT_NOTE_END */


			function init() {

				renderer = new THREE.WebGLRenderer();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				document.body.appendChild( renderer.domElement );

				//

				camera = new THREE.PerspectiveCamera( 70, window.innerWidth / window.innerHeight, 1, 1000 );
				camera.position.z = 400;

				scene = new THREE.Scene();

				light = new THREE.PointLight();
				light.position.set( 200, 100, 150 );
				scene.add( light );

				scene.add( new THREE.PointLightHelper( light, 15 ) );

				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：GridHelper 的第一个参数是总尺寸，第二个参数是分段数量。
				 * THREE_TOPIC_CORE_NOTE_END */
				const gridHelper = new THREE.GridHelper( 400, 40, 0x0000ff, 0x808080 );
				gridHelper.position.y = - 150;
				gridHelper.position.x = - 150;
				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：BoxHelper 会根据对象当前世界矩阵计算包围盒，因此能快速发现模型尺寸过大、偏移或旋转异常。
				 * THREE_TOPIC_CORE_NOTE_END */
				scene.add( gridHelper );

				const polarGridHelper = new THREE.PolarGridHelper( 200, 16, 8, 64, 0x0000ff, 0x808080 );
				polarGridHelper.position.y = - 150;
				polarGridHelper.position.x = 200;
				scene.add( polarGridHelper );

				const loader = new GLTFLoader();
				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：BoxHelper 包住 Group 时，会包含所有子对象。
				 * THREE_TOPIC_CORE_NOTE_END */
				loader.load( 'models/gltf/LeePerrySmith/LeePerrySmith.glb', function ( gltf ) {

					/* THREE_TOPIC_CORE_NOTE_START
					 * 学习注释：BoxHelper 包住 Scene 时，会把场景中所有可见对象作为整体范围。
					 * THREE_TOPIC_CORE_NOTE_END */
					const mesh = gltf.scene.children[ 0 ];

					mesh.geometry.computeTangents(); // generates bad data due to degenerate UVs

					const group = new THREE.Group();
					group.scale.multiplyScalar( 50 );
					scene.add( group );

					// To make sure that the matrixWorld is up to date for the boxhelpers
					group.updateMatrixWorld( true );

					/* THREE_TOPIC_CORE_NOTE_START
					 * 学习注释：项目上线通常隐藏 helper，但开发期应该大量使用它们。
					 * THREE_TOPIC_CORE_NOTE_END */
					group.add( mesh );

					vnh = new VertexNormalsHelper( mesh, 5 );
					scene.add( vnh );

					vth = new VertexTangentsHelper( mesh, 5 );
					scene.add( vth );

					/* THREE_TOPIC_CORE_NOTE_START
					 * 学习注释：项目上线通常隐藏 helper，但开发期应该大量使用它们。
					 * THREE_TOPIC_CORE_NOTE_END */
					scene.add( new THREE.BoxHelper( mesh ) );

					const wireframe = new THREE.WireframeGeometry( mesh.geometry );
					let line = new THREE.LineSegments( wireframe );
					line.material.depthTest = false;
					line.material.opacity = 0.25;
					line.material.transparent = true;
					line.position.x = 4;
					group.add( line );
					scene.add( new THREE.BoxHelper( line ) );

					const edges = new THREE.EdgesGeometry( mesh.geometry );
					line = new THREE.LineSegments( edges );
					line.material.depthTest = false;
					line.material.opacity = 0.25;
					line.material.transparent = true;
					line.position.x = - 4;
					group.add( line );
					scene.add( new THREE.BoxHelper( line ) );

					scene.add( new THREE.BoxHelper( group ) );
					scene.add( new THREE.BoxHelper( scene ) );


				} );

				//

				window.addEventListener( 'resize', onWindowResize );

			}
			/* THREE_TOPIC_RESIZE_NOTE_START
			 * 窗口变化时不能只改 canvas 尺寸；相机 aspect / 投影矩阵 / renderer 尺寸通常都要一起更新，否则画面比例或交互坐标会出问题。
			 * THREE_TOPIC_RESIZE_NOTE_END */


			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}
			/* THREE_TOPIC_ANIMATE_NOTE_START
			 * animate() 是每帧循环入口。这里通常推进 controls、动画 mixer、物理世界或实例矩阵，然后触发 render。不要只看静态初始化，动态效果多数在这里发生。
			 * THREE_TOPIC_ANIMATE_NOTE_END */


			function animate() {

				const time = - performance.now() * 0.0003;

				camera.position.x = 400 * Math.cos( time );
				camera.position.z = 400 * Math.sin( time );
				camera.lookAt( scene.position );

				light.position.x = Math.sin( time * 1.7 ) * 300;
				light.position.y = Math.cos( time * 1.5 ) * 400;
				light.position.z = Math.cos( time * 1.3 ) * 300;

				if ( vnh ) vnh.update();
				if ( vth ) vth.update();

				renderer.render( scene, camera );

			}

		</script>

	</body>
</html>
