<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - lights - spotlight</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgl - lights - spotlight">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgl_lights_spotlight.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgl_lights_spotlight.jpg">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> webgl - spotlight<br />
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			
			/* THREE_TOPIC_LEARNING_NOTES_START
			 * 本注释由本地 Three.js 专题生成，保留官网案例代码结构，只补学习说明。
			 * 案例：webgl_lights_spotlight.html
			 * 分组：B｜光照材质
			 * 目标：学习聚光灯的完整控制参数，包括 angle、penumbra、decay、distance、shadow.focus、map 和 helper。
			 *
			 * 阅读顺序：先找 renderer 的 color/toneMapping/output 设置，再找 light / material / environment，最后看 GUI 参数如何改变光照或材质。光照材质类案例要重点观察“哪个参数改变了亮度、阴影、反射、透明或贴图清晰度”。
			 *
			 * 核心知识点：
			 * 1. SpotLight 是锥形光源
			 * 2. angle 控制锥形开口
			 * 3. penumbra 控制边缘软硬
			 * 4. map 可以投射纹理光斑
			 * 5. shadow camera 决定阴影质量和范围
			 *
			 * 本案例的关键代码片段，可以在下面源码中搜索这些语句：
			 *   spotLight = new THREE.SpotLight( 0xffffff, 100 );
			 *   spotLight.map = textures[ 'disturb.jpg' ];
			 *   spotLight.position.set( 2.5, 5, 2.5 );
			 *   spotLight.angle = Math.PI / 6;
			 *   spotLight.penumbra = 1;
			 *   spotLight.decay = 2;
			 *   spotLight.castShadow = true;
			 *   spotLight.shadow.bias = - .003;
			 *
			 * 这些代码在做什么：
			 * 1. angle 越大，照亮范围越宽，但单位面积能量观感会更散。
			 * 2. penumbra 越大，光斑边缘越柔。
			 * 3. map 让聚光灯像投影仪一样带图案。
			 * 4. shadow.focus 会影响阴影投射区域聚焦方式。
			 * 5. bias 用于减轻阴影痤疮，但过大可能让阴影漂浮。
			 *
			 * 学完后可以迁移到：
			 * 1. 舞台灯
			 * 2. 手电筒
			 * 3. 车灯
			 * 4. 投影图案
			 * 5. 局部强调光
			 *
			 * 对应讲解文档：../官方案例讲解/B-光照材质/webgl_lights_spotlight.md
			 * THREE_TOPIC_LEARNING_NOTES_END */
import * as THREE from 'three';

			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

			import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

			let renderer, scene, camera;

			let spotLight;

			init();
			/* THREE_TOPIC_INIT_NOTE_START
			 * init() 是案例搭建阶段：通常会创建 renderer、camera、scene、灯光、材质、模型、GUI 和事件。读这个函数时先看对象如何被创建和加入 scene。
			 * THREE_TOPIC_INIT_NOTE_END */


			function init() {

				// Renderer

				renderer = new THREE.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				document.body.appendChild( renderer.domElement );

				renderer.toneMapping = THREE.NeutralToneMapping;
				renderer.toneMappingExposure = 1;

				renderer.shadowMap.enabled = true;
				renderer.shadowMap.type = THREE.PCFShadowMap;

				scene = new THREE.Scene();

				camera = new THREE.PerspectiveCamera( 40, window.innerWidth / window.innerHeight, 0.1, 100 );
				camera.position.set( 7, 4, 1 );

				// Controls

				const controls = new OrbitControls( camera, renderer.domElement );
				controls.minDistance = 2;
				controls.maxDistance = 10;
				controls.maxPolarAngle = Math.PI / 2;
				controls.target.set( 0, 1, 0 );
				controls.update();

				// Textures

				const loader = new THREE.TextureLoader().setPath( 'textures/' );
				const filenames = [ 'disturb.jpg', 'colors.png', 'uv_grid_opengl.jpg' ];

				const textures = { none: null };

				for ( let i = 0; i < filenames.length; i ++ ) {

					const filename = filenames[ i ];

					const texture = loader.load( filename );
					texture.minFilter = THREE.LinearFilter;
					texture.magFilter = THREE.LinearFilter;
					texture.generateMipmaps = false;
					texture.colorSpace = THREE.SRGBColorSpace;

					textures[ filename ] = texture;

				}

				// Lights

				const ambient = new THREE.HemisphereLight( 0xffffff, 0x8d8d8d, 0.25 );
				scene.add( ambient );

				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：angle 越大，照亮范围越宽，但单位面积能量观感会更散。
				 * THREE_TOPIC_CORE_NOTE_END */
				spotLight = new THREE.SpotLight( 0xffffff, 100 );
				spotLight.name = 'spotLight';
				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：penumbra 越大，光斑边缘越柔。
				 * THREE_TOPIC_CORE_NOTE_END */
				spotLight.map = textures[ 'disturb.jpg' ];
				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：map 让聚光灯像投影仪一样带图案。
				 * THREE_TOPIC_CORE_NOTE_END */
				spotLight.position.set( 2.5, 5, 2.5 );
				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：shadow.focus 会影响阴影投射区域聚焦方式。
				 * THREE_TOPIC_CORE_NOTE_END */
				spotLight.angle = Math.PI / 6;
				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：bias 用于减轻阴影痤疮，但过大可能让阴影漂浮。
				 * THREE_TOPIC_CORE_NOTE_END */
				spotLight.penumbra = 1;
				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：bias 用于减轻阴影痤疮，但过大可能让阴影漂浮。
				 * THREE_TOPIC_CORE_NOTE_END */
				spotLight.decay = 2;
				spotLight.distance = 0;

				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：bias 用于减轻阴影痤疮，但过大可能让阴影漂浮。
				 * THREE_TOPIC_CORE_NOTE_END */
				spotLight.castShadow = true;
				spotLight.shadow.mapSize.width = 1024;
				spotLight.shadow.mapSize.height = 1024;
				spotLight.shadow.camera.near = 2;
				spotLight.shadow.camera.far = 10;
				spotLight.shadow.focus = 1;
				/* THREE_TOPIC_CORE_NOTE_START
				 * 学习注释：bias 用于减轻阴影痤疮，但过大可能让阴影漂浮。
				 * THREE_TOPIC_CORE_NOTE_END */
				spotLight.shadow.bias = - .003;
				spotLight.shadow.intensity = 1;
				scene.add( spotLight );

				spotLight.lightHelper = new THREE.SpotLightHelper( spotLight );
				spotLight.lightHelper.visible = false;
				scene.add( spotLight.lightHelper );

				spotLight.shadowCameraHelper = new THREE.CameraHelper( spotLight.shadow.camera ); // colored lines
				spotLight.shadowCameraHelper.visible = false;
				scene.add( spotLight.shadowCameraHelper );

				//

				const geometry = new THREE.PlaneGeometry( 10, 10 );
				const material = new THREE.MeshLambertMaterial( { color: 0xbcbcbc } );

				const mesh = new THREE.Mesh( geometry, material );
				mesh.position.set( 0, - 1, 0 );
				mesh.rotation.x = - Math.PI / 2;
				mesh.receiveShadow = true;
				scene.add( mesh );

				// Model

				new PLYLoader().load( 'models/ply/binary/Lucy100k.ply', function ( geometry ) {

					geometry.scale( 0.0024, 0.0024, 0.0024 );
					geometry.computeVertexNormals();

					const material = new THREE.MeshLambertMaterial();

					const mesh = new THREE.Mesh( geometry, material );
					mesh.rotation.y = - Math.PI / 2;
					mesh.position.y = 0.8;
					mesh.castShadow = true;
					mesh.receiveShadow = true;
					scene.add( mesh );

				} );

				//

				window.addEventListener( 'resize', onWindowResize );

				// GUI

				const gui = new GUI();

				const params = {
					map: textures[ 'disturb.jpg' ],
					color: spotLight.color.getHex(),
					intensity: spotLight.intensity,
					distance: spotLight.distance,
					angle: spotLight.angle,
					penumbra: spotLight.penumbra,
					decay: spotLight.decay,
					focus: spotLight.shadow.focus,
					shadowIntensity: spotLight.shadow.intensity,
					helpers: false
				};

				gui.add( params, 'map', textures ).onChange( function ( val ) {

					spotLight.map = val;

				} );

				gui.addColor( params, 'color' ).onChange( function ( val ) {

					spotLight.color.setHex( val );

				} );

				gui.add( params, 'intensity', 0, 500 ).onChange( function ( val ) {

					spotLight.intensity = val;

				} );


				gui.add( params, 'distance', 0, 20 ).onChange( function ( val ) {

					spotLight.distance = val;

				} );

				gui.add( params, 'angle', 0, Math.PI / 3 ).onChange( function ( val ) {

					spotLight.angle = val;

				} );

				gui.add( params, 'penumbra', 0, 1 ).onChange( function ( val ) {

					spotLight.penumbra = val;

				} );

				gui.add( params, 'decay', 1, 2 ).onChange( function ( val ) {

					spotLight.decay = val;

				} );

				gui.add( params, 'focus', 0, 1 ).onChange( function ( val ) {

					spotLight.shadow.focus = val;

				} );

				gui.add( params, 'shadowIntensity', 0, 1 ).onChange( function ( val ) {

					spotLight.shadow.intensity = val;

				} );

				gui.add( params, 'helpers' ).onChange( function ( val ) {

					spotLight.lightHelper.visible = val;
					spotLight.shadowCameraHelper.visible = val;

				} );

				gui.open();

			}
			/* THREE_TOPIC_RESIZE_NOTE_START
			 * 窗口变化时不能只改 canvas 尺寸；相机 aspect / 投影矩阵 / renderer 尺寸通常都要一起更新，否则画面比例或交互坐标会出问题。
			 * THREE_TOPIC_RESIZE_NOTE_END */


			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}
			/* THREE_TOPIC_ANIMATE_NOTE_START
			 * animate() 是每帧循环入口。这里通常推进 controls、动画 mixer、物理世界或实例矩阵，然后触发 render。不要只看静态初始化，动态效果多数在这里发生。
			 * THREE_TOPIC_ANIMATE_NOTE_END */


			function animate() {

				const time = performance.now() / 3000;

				spotLight.position.x = Math.cos( time ) * 2.5;
				spotLight.position.z = Math.sin( time ) * 2.5;

				spotLight.lightHelper.update();

				renderer.render( scene, camera );

			}

		</script>

	</body>

</html>
