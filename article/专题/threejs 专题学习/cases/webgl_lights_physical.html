<!DOCTYPE html>
<html lang="en">

<head>
	<title>three.js webgl - lights - physical lights</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
	<meta property="og:title" content="three.js webgl - lights - physical lights">
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://threejs.org/examples/webgl_lights_physical.html">
	<meta property="og:image" content="https://threejs.org/examples/screenshots/webgl_lights_physical.jpg">
	<link type="text/css" rel="stylesheet" href="main.css">
</head>

<body>

	<div id="container"></div>
	<div id="info">
		<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - Physically accurate incandescent bulb by
		<a href="http://clara.io" target="_blank" rel="noopener">Ben Houston</a><br />
		Real world scale: Brick cube is 50 cm in size. Globe is 50 cm in diameter.<br />
		Reinhard inline tonemapping with real-world light falloff (decay = 2).
	</div>

	<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

	<script type="module">


		/* THREE_TOPIC_LEARNING_NOTES_START
		 * 本注释由本地 Three.js 专题生成，保留官网案例代码结构，只补学习说明。
		 * 案例：webgl_lights_physical.html
		 * 分组：B｜光照材质
		 * 目标：学习 three.js 里物理灯光的整体链路：PointLight、HemisphereLight、真实 lumen/lux、decay=2、toneMappingExposure 和阴影。
		 *
		 * 阅读顺序：先找 renderer 的 color/toneMapping/output 设置，再找 light / material / environment，最后看 GUI 参数如何改变光照或材质。光照材质类案例要重点观察“哪个参数改变了亮度、阴影、反射、透明或贴图清晰度”。
		 *
		 * 核心知识点：
		 * 1. PointLight 用 lumen 级别模拟灯泡
		 * 2. HemisphereLight 用 lux 级别模拟环境照度
		 * 3. decay=2 是物理平方衰减
		 * 4. toneMappingExposure 控制输出曝光
		 * 5. 真实尺度会影响光照观感
		 *
		 * 本案例的关键代码片段，可以在下面源码中搜索这些语句：
		 *   bulbLight = new THREE.PointLight( 0xffee88, 1, 100, 2 );
		 *   bulbLight.castShadow = true;
		 *   
		 *   hemiLight = new THREE.HemisphereLight( 0xddeeff, 0x0f0e0d, 0.02 );
		 *   
		 *   renderer.toneMapping = THREE.ReinhardToneMapping;
		 *   renderer.toneMappingExposure = Math.pow( params.exposure, 5.0 );
		 *   
		 *   bulbLight.power = bulbLuminousPowers[ params.bulbPower ];
		 *   hemiLight.intensity = hemiLuminousIrradiances[ params.hemiIrradiance ];
		 *
		 * 这些代码在做什么：
		 * 1. PointLight 的 power 可以用 lumen 思考，比随便填 intensity 更接近现实。
		 * 2. HemisphereLight 的 intensity 在这个案例中用环境照度 lux 做参考。
		 * 3. decay=2 让光按真实平方反比衰减，所以距离非常重要。
		 * 4. 曝光会影响最终画面亮度，但不改变灯本身的物理强度。
		 * 5. 案例里的砖块 50cm、灯泡 50cm，是为了让真实光照单位有意义。
		 *
		 * 学完后可以迁移到：
		 * 1. 室内灯光模拟
		 * 2. 产品棚拍
		 * 3. 真实单位灯具配置器
		 * 4. 建筑照明可视化
		 * 5. 学习 PBR 曝光工作流
		 *
		 * 对应讲解文档：../官方案例讲解/B-光照材质/webgl_lights_physical.md
		 * THREE_TOPIC_LEARNING_NOTES_END */
		import * as THREE from 'three';

		import Stats from 'three/addons/libs/stats.module.js';
		import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

		import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

		let camera, scene, renderer, bulbLight, bulbMat, hemiLight, stats;
		let ballMat, cubeMat, floorMat;

		let previousShadowMap = false;


		// ref for lumens: http://www.power-sure.com/lumens.htm
		const bulbLuminousPowers = {
			'110000 lm (1000W)': 110000,
			'3500 lm (300W)': 3500,
			'1700 lm (100W)': 1700,
			'800 lm (60W)': 800,
			'400 lm (40W)': 400,
			'180 lm (25W)': 180,
			'20 lm (4W)': 20,
			'Off': 0
		};

		// ref for solar irradiances: https://en.wikipedia.org/wiki/Lux
		const hemiLuminousIrradiances = {
			'0.0001 lx (Moonless Night)': 0.0001,
			'0.002 lx (Night Airglow)': 0.002,
			'0.5 lx (Full Moon)': 0.5,
			'3.4 lx (City Twilight)': 3.4,
			'50 lx (Living Room)': 50,
			'100 lx (Very Overcast)': 100,
			'350 lx (Office Room)': 350,
			'400 lx (Sunrise/Sunset)': 400,
			'1000 lx (Overcast)': 1000,
			'18000 lx (Daylight)': 18000,
			'50000 lx (Direct Sun)': 50000
		};

		const params = {
			shadows: true,
			exposure: 0.68,
			bulbPower: Object.keys(bulbLuminousPowers)[4],
			hemiIrradiance: Object.keys(hemiLuminousIrradiances)[0]
		};

		init();
		/* THREE_TOPIC_INIT_NOTE_START
		 * init() 是案例搭建阶段：通常会创建 renderer、camera、scene、灯光、材质、模型、GUI 和事件。读这个函数时先看对象如何被创建和加入 scene。
		 * THREE_TOPIC_INIT_NOTE_END */


		function init() {

			const container = document.getElementById('container');

			stats = new Stats();
			container.appendChild(stats.dom);


			camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
			camera.position.x = - 4;
			camera.position.z = 4;
			camera.position.y = 2;

			scene = new THREE.Scene();

			const bulbGeometry = new THREE.SphereGeometry(0.02, 16, 8);
			/* THREE_TOPIC_CORE_NOTE_START
			 * 学习注释：PointLight 的 power 可以用 lumen 思考，比随便填 intensity 更接近现实。
			 * THREE_TOPIC_CORE_NOTE_END */
			bulbLight = new THREE.PointLight(0xffee88, 1, 100, 2);

			bulbMat = new THREE.MeshStandardMaterial({
				emissive: 0xffffee,
				emissiveIntensity: 1,
				color: 0x000000
			});
			bulbLight.add(new THREE.Mesh(bulbGeometry, bulbMat));
			bulbLight.position.set(0, 2, 0);
			/* THREE_TOPIC_CORE_NOTE_START
			 * 学习注释：HemisphereLight 的 intensity 在这个案例中用环境照度 lux 做参考。
			 * THREE_TOPIC_CORE_NOTE_END */
			bulbLight.castShadow = true;
			scene.add(bulbLight);

			/* THREE_TOPIC_CORE_NOTE_START
			 * 学习注释：decay=2 让光按真实平方反比衰减，所以距离非常重要。
			 * THREE_TOPIC_CORE_NOTE_END */
			hemiLight = new THREE.HemisphereLight(0xddeeff, 0x0f0e0d, 0.02);
			scene.add(hemiLight);

			floorMat = new THREE.MeshStandardMaterial({
				roughness: 0.8,
				color: 0xffffff,
				metalness: 0.2,
				bumpScale: 1
			});
			const textureLoader = new THREE.TextureLoader();
			textureLoader.load('textures/hardwood2_diffuse.jpg', function (map) {

				map.wrapS = THREE.RepeatWrapping;
				map.wrapT = THREE.RepeatWrapping;
				map.anisotropy = 4;
				map.repeat.set(10, 24);
				map.colorSpace = THREE.SRGBColorSpace;
				floorMat.map = map;
				floorMat.needsUpdate = true;

			});

			cubeMat = new THREE.MeshStandardMaterial({
				roughness: 0.7,
				color: 0xffffff,
				bumpScale: 1,
				metalness: 0.2
			});
			textureLoader.load('textures/brick_diffuse.jpg', function (map) {

				map.wrapS = THREE.RepeatWrapping;
				map.wrapT = THREE.RepeatWrapping;
				map.anisotropy = 4;
				map.repeat.set(1, 1);
				map.colorSpace = THREE.SRGBColorSpace;
				cubeMat.map = map;
				cubeMat.needsUpdate = true;

			});
			textureLoader.load('textures/brick_bump.jpg', function (map) {

				map.wrapS = THREE.RepeatWrapping;
				map.wrapT = THREE.RepeatWrapping;
				map.anisotropy = 4;
				map.repeat.set(1, 1);
				cubeMat.bumpMap = map;
				cubeMat.needsUpdate = true;

			});

			ballMat = new THREE.MeshStandardMaterial({
				color: 0xffffff,
				roughness: 0.5,
				metalness: 1.0
			});
			textureLoader.load('textures/planets/earth_atmos_2048.jpg', function (map) {

				map.anisotropy = 4;
				map.colorSpace = THREE.SRGBColorSpace;
				ballMat.map = map;
				ballMat.needsUpdate = true;

			});
			textureLoader.load('textures/planets/earth_specular_2048.jpg', function (map) {

				map.anisotropy = 4;
				map.colorSpace = THREE.SRGBColorSpace;
				ballMat.metalnessMap = map;
				ballMat.needsUpdate = true;

			});

			const floorGeometry = new THREE.PlaneGeometry(20, 20);
			const floorMesh = new THREE.Mesh(floorGeometry, floorMat);
			floorMesh.receiveShadow = true;
			floorMesh.rotation.x = - Math.PI / 2.0;
			scene.add(floorMesh);

			const ballGeometry = new THREE.SphereGeometry(0.25, 32, 32);
			const ballMesh = new THREE.Mesh(ballGeometry, ballMat);
			ballMesh.position.set(1, 0.25, 1);
			ballMesh.rotation.y = Math.PI;
			ballMesh.castShadow = true;
			scene.add(ballMesh);

			const boxGeometry = new THREE.BoxGeometry(0.5, 0.5, 0.5);
			const boxMesh = new THREE.Mesh(boxGeometry, cubeMat);
			boxMesh.position.set(- 0.5, 0.25, - 1);
			boxMesh.castShadow = true;
			scene.add(boxMesh);

			const boxMesh2 = new THREE.Mesh(boxGeometry, cubeMat);
			boxMesh2.position.set(0, 0.25, - 5);
			boxMesh2.castShadow = true;
			scene.add(boxMesh2);

			const boxMesh3 = new THREE.Mesh(boxGeometry, cubeMat);
			boxMesh3.position.set(7, 0.25, 0);
			boxMesh3.castShadow = true;
			scene.add(boxMesh3);


			renderer = new THREE.WebGLRenderer();
			renderer.setPixelRatio(window.devicePixelRatio);
			renderer.setSize(window.innerWidth, window.innerHeight);
			renderer.setAnimationLoop(animate);
			renderer.shadowMap.enabled = true;
			/* THREE_TOPIC_CORE_NOTE_START
			 * 学习注释：曝光会影响最终画面亮度，但不改变灯本身的物理强度。
			 * THREE_TOPIC_CORE_NOTE_END */
			renderer.toneMapping = THREE.ReinhardToneMapping;
			container.appendChild(renderer.domElement);


			const controls = new OrbitControls(camera, renderer.domElement);
			controls.minDistance = 1;
			controls.maxDistance = 20;

			window.addEventListener('resize', onWindowResize);


			const gui = new GUI();

			gui.add(params, 'hemiIrradiance', Object.keys(hemiLuminousIrradiances));
			gui.add(params, 'bulbPower', Object.keys(bulbLuminousPowers));
			gui.add(params, 'exposure', 0, 1);
			gui.add(params, 'shadows');
			gui.open();

		}
		/* THREE_TOPIC_RESIZE_NOTE_START
		 * 窗口变化时不能只改 canvas 尺寸；相机 aspect / 投影矩阵 / renderer 尺寸通常都要一起更新，否则画面比例或交互坐标会出问题。
		 * THREE_TOPIC_RESIZE_NOTE_END */


		function onWindowResize() {

			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();

			renderer.setSize(window.innerWidth, window.innerHeight);

		}

		//
		/* THREE_TOPIC_ANIMATE_NOTE_START
		 * animate() 是每帧循环入口。这里通常推进 controls、动画 mixer、物理世界或实例矩阵，然后触发 render。不要只看静态初始化，动态效果多数在这里发生。
		 * THREE_TOPIC_ANIMATE_NOTE_END */


		function animate() {

			renderer.toneMappingExposure = Math.pow(params.exposure, 5.0); // to allow for very bright scenes.
			renderer.shadowMap.enabled = params.shadows;
			bulbLight.castShadow = params.shadows;

			if (params.shadows !== previousShadowMap) {

				ballMat.needsUpdate = true;
				cubeMat.needsUpdate = true;
				floorMat.needsUpdate = true;
				previousShadowMap = params.shadows;

			}

			/* THREE_TOPIC_CORE_NOTE_START
			 * 学习注释：案例里的砖块 50cm、灯泡 50cm，是为了让真实光照单位有意义。
			 * THREE_TOPIC_CORE_NOTE_END */
			bulbLight.power = bulbLuminousPowers[params.bulbPower];
			bulbMat.emissiveIntensity = bulbLight.intensity / Math.pow(0.02, 2.0); // convert from intensity to irradiance at bulb surface

			/* THREE_TOPIC_CORE_NOTE_START
			 * 学习注释：案例里的砖块 50cm、灯泡 50cm，是为了让真实光照单位有意义。
			 * THREE_TOPIC_CORE_NOTE_END */
			hemiLight.intensity = hemiLuminousIrradiances[params.hemiIrradiance];
			const time = Date.now() * 0.0005;

			bulbLight.position.y = Math.cos(time) * 0.75 + 1.25;

			renderer.render(scene, camera);

			stats.update();

		}

	</script>
</body>

</html>
